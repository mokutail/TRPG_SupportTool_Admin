<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター閲覧 - Cthulhu Architect</title>
    <style>
        body { background-color: #36393f; color: #dcddde; margin: 0; padding: 0 0 20px 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        .header-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; border-bottom: 1px solid #202225; padding: 15px 40px; 
            background-color: #36393f; position: sticky; top: 0; z-index: 1000;
        }
        .header-bar h2 { margin: 0; color: #fff; font-size: 28px; }
        .header-actions { display: flex; gap: 15px; }
        .btn-new, .btn-action { background: #4f545c; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .btn-new:hover, .btn-action:hover { background: #686d73; }
        .btn-action.export { background: #007bff; } .btn-action.export:hover { background: #0056b3; }
        .btn-action.edit { background: #28a745; } .btn-action.edit:hover { background: #218838; }

        /* レイアウトの最適化（横スクロール対策） */
        .layout-wrapper { display: flex; gap: 20px; max-width: 100%; padding: 0 20px; box-sizing: border-box; margin: 0 auto; align-items: flex-start; justify-content: center; }
        
        .left-sidebar { flex: 0 0 220px; position: sticky; top: 90px; }
        .right-sidebar { flex: 1 1 350px; max-width: 450px; position: sticky; top: 90px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 5px; font-size: 14px;}
        
        .filter-panel, .color-panel { background: #2f3136; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; box-sizing: border-box; }
        .color-panel { margin-top: 15px; }
        .filter-title { margin-top: 0; color: #b9bbbe; font-size: 13px; border-bottom: 1px solid #4f545c; padding-bottom: 8px; margin-bottom: 10px; text-align: center; }
        .filter-label { display: block; color: #dcddde; font-size: 13px; margin-bottom: 8px; cursor: pointer; padding: 8px; border-radius: 4px; transition: 0.2s; font-weight: bold; }
        .filter-label:hover { background: #36393f; }
        .filter-label input { margin-right: 8px; accent-color: #6366f1; transform: scale(1.1); }

        .color-display { display: flex; align-items: center; gap: 15px; margin-top: 10px; justify-content: center; }
        .color-box { width: 40px; height: 40px; border-radius: 6px; border: 2px solid #4f545c; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .color-code { color: #fff; font-weight: bold; font-family: monospace; font-size: 14px; }

        .center-content { flex: 2 1 600px; min-width: 0; display: flex; gap: 30px; background: #2f3136; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .left-col { flex: 0 0 320px; display: flex; flex-direction: column; gap: 15px; }
        .right-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

        .image-carousel { position: relative; width: 100%; height: 500px; background: #202225; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #4f545c; overflow: hidden; }
        .image-carousel img { width: 100%; height: 100%; object-fit: contain; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 20px; width: 40px; height: 40px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .nav-btn:hover { background: rgba(0,0,0,0.9); }
        .nav-btn.left { left: 10px; } .nav-btn.right { right: 10px; }
        .img-desc { font-size: 13px; color: #b9bbbe; text-align: center; font-weight: bold; min-height: 20px; }
        .tag-area { font-size: 13px; color: #fff; background: #202225; padding: 10px 15px; border-radius: 4px; border: 1px solid #4f545c; text-align: center; }

        .expr-container { border-top: 1px solid #4f545c; padding-top: 15px; margin-top: 10px; }
        .expr-title { font-size: 13px; color: #b9bbbe; font-weight: bold; margin-bottom: 15px; text-align: center; letter-spacing: 1px; }
        .expr-list { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
        .expr-icon { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #36393f; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #000; position: relative; z-index: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .expr-icon:not(:first-child) { margin-top: -25px; }
        .expr-icon:nth-child(odd) { transform: translateX(-30px); }
        .expr-icon:nth-child(even) { transform: translateX(30px); }
        .expr-icon:nth-child(odd):hover { border-color: #6366f1; transform: translateX(-30px) scale(1.1); z-index: 10; }
        .expr-icon:nth-child(even):hover { border-color: #6366f1; transform: translateX(30px) scale(1.1); z-index: 10; }

        .accordion-item { background: #2f3136; border-radius: 4px; border: 1px solid #4f545c; overflow: hidden; }
        .accordion-header { padding: 12px 15px; color: #dcddde; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #202225; transition: 0.2s; user-select: none; }
        .accordion-header:hover { background: #36393f; }
        .accordion-header span { font-size: 12px; transition: transform 0.3s; }
        .accordion-item.open .accordion-header span { transform: rotate(-90deg); }
        .accordion-content { padding: 15px; font-size: 13px; color: #b9bbbe; line-height: 1.6; display: none; border-top: 1px solid #4f545c; }
        .accordion-item.open .accordion-content { display: block; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; margin-bottom: 5px; }
        .data-table th { background: #18191c; color: #b9bbbe; padding: 6px; border: 1px solid #4f545c; white-space: nowrap; }
        .data-table td { background: #202225; color: #dcddde; padding: 6px; border: 1px solid #4f545c; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index: 9999; }
        .modal-content { background:#1e1e24; padding:20px; border-radius:8px; border:1px solid #6366f1; width: 350px; display: flex; flex-direction: column; gap: 10px;}
        .modal-content h3 { color: white; margin-top: 0; text-align: center;}
        .btn-select { background: #4f545c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-select:hover { background: #686d73; }
        .btn-select.cancel { background: #f04747; margin-top: 10px;} .btn-select.cancel:hover { background: #d84040; }

        .name-section { text-align: center; border-bottom: 2px solid #4f545c; padding-bottom: 15px; }
        .furigana { font-size: 13px; color: #b9bbbe; letter-spacing: 2px; }
        .name { font-size: 32px; font-weight: bold; color: #fff; margin: 5px 0; letter-spacing: 2px; }
        .profile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-bottom: 2px solid #4f545c; padding-bottom: 15px; }
        .profile-item { display: flex; flex-direction: column; padding: 0 5px; border-right: 1px solid #4f545c; }
        .profile-item:nth-child(4n) { border-right: none; }
        .profile-label { color: #b9bbbe; font-size: 11px; font-weight: bold; margin-bottom: 2px; }
        .profile-value { color: #fff; font-weight: bold; font-size: 14px; }
        .stats-row { display: flex; justify-content: space-between; text-align: center; border-bottom: 2px solid #4f545c; padding-bottom: 15px; }
        .stat-box { flex: 1; }
        .stat-label { font-size: 12px; color: #b9bbbe; font-weight: bold; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #fff; }
        .derived-stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .derived-box { border: 1px solid #b9bbbe; padding: 6px 15px; border-radius: 4px; font-weight: bold; font-size: 13px; background: #202225; }
        .derived-box.san-box { border-color: #fff; }
        
        .skill-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; background: #202225; border-radius: 8px; overflow: hidden; }
        .skill-table th { background: #18191c; padding: 8px; border-bottom: 2px solid #4f545c; color: #b9bbbe; white-space: nowrap; }
        .skill-table td { padding: 6px 8px; border-bottom: 1px solid #36393f; color: #dcddde; white-space: nowrap; }
        .skill-name { text-align: left; font-weight: bold; color: #fff; }
        .skill-total { font-weight: bold; color: #5ce1e6; background: #2f3136; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header-bar">
        <h2>キャラクター閲覧</h2>
        <div class="header-actions">
            <button id="edit-btn" class="btn-action edit" onclick="goToEdit()">🖊 編集</button>
            <button class="btn-action export" onclick="openExportModal()">📤 出力</button>
            <a href="index.html" class="btn-new">玄関に戻る</a>
        </div>
    </div>

    <div id="export-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>出力形式を選択</h3>
            <button class="btn-select" onclick="exportCCfolia(false)">ココフォリア出力 (変更した技能のみ)</button>
            <button class="btn-select" onclick="exportCCfolia(true)">ココフォリア出力 (すべての技能)</button>
            <button class="btn-select cancel" onclick="closeExportModal()">キャンセル</button>
        </div>
    </div>

    <div id="view-content"><p style="text-align:center; padding-top: 50px;">データを読み込んでいます...</p></div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // グローバルに使えるように登録
        window.db = db;
        window.doc = doc;
        window.getDoc = getDoc;

        // モジュールロード完了後にデータを取得開始
        window.initializeView();
    </script>

    <script>
        let currentImageIndex = 0;

        // ★ Firebase からデータを取得するメイン処理
        window.initializeView = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const charId = urlParams.get('id');

            // 1. URLにIDがある場合（他人が共有URLから開いた場合）
            if (charId) {
                // 他人が開いた場合は編集ボタンを隠す
                document.getElementById('edit-btn').style.display = 'none';
                
                try {
                    const docRef = window.doc(window.db, "characters", charId);
                    const docSnap = await window.getDoc(docRef);
                    if (docSnap.exists()) {
                        window.char = docSnap.data();
                        setupImagesAndRender();
                    } else {
                        document.getElementById('view-content').innerHTML = '<p style="text-align:center; padding-top:50px;">指定されたキャラクターデータが見つかりません。<br>削除されたか、URLが間違っている可能性があります。</p>';
                    }
                } catch(e) {
                    console.error("Firebase取得エラー:", e);
                    document.getElementById('view-content').innerHTML = '<p style="text-align:center; padding-top:50px;">データの通信に失敗しました。</p>';
                }
            } 
            // 2. 自分がローカルの「閲覧」ボタンから開いた場合
            else {
                const index = localStorage.getItem('viewingIndex');
                const chars = JSON.parse(localStorage.getItem('characters') || '[]');
                window.char = chars[index];
                
                if (!window.char || Object.keys(window.char).length === 0) {
                    document.getElementById('view-content').innerHTML = '<p style="text-align:center; padding-top:50px;">データが見つかりません。玄関からキャラクターを選択してください。</p>';
                } else {
                    setupImagesAndRender();
                }
            }
        };

        function setupImagesAndRender() {
            window.viewMainImages = window.char?.mainImages || window.char?.images || [];
            window.viewExprImages = window.char?.exprImages || [];
            if (window.char?.iconUrl && window.viewMainImages.length === 0) {
                window.viewMainImages.push({url: window.char.iconUrl, desc: ''});
            }
            renderView();
        }

        // データ取得補助関数
        function getVal(key) { return window.char[key] || ''; }
        function getNum(key) { return parseInt(window.char[key]) || 0; }
        
        function goToEdit() { 
            const index = localStorage.getItem('viewingIndex');
            localStorage.setItem('editingIndex', index); 
            window.location.href = 'coc6th_editor/coc6th_edit.html'; 
        }
        
        function openExportModal() { document.getElementById('export-modal').style.display = 'flex'; }
        function closeExportModal() { document.getElementById('export-modal').style.display = 'none'; }
        
        function changeImage(dir) {
            if(window.viewMainImages.length === 0) return;
            currentImageIndex = (currentImageIndex + dir + window.viewMainImages.length) % window.viewMainImages.length;
            setPreviewImage(window.viewMainImages[currentImageIndex].url, window.viewMainImages[currentImageIndex].desc);
        }

        function setPreviewImage(url, desc) {
            const imgEl = document.getElementById('main-preview-img');
            const descEl = document.getElementById('main-preview-desc');
            if (imgEl) imgEl.src = url;
            if (descEl) descEl.textContent = desc || '';
        }

        window.unlockMemo = function(idx, correctPwd) {
            const inputVal = document.getElementById(`pwd-input-${idx}`).value;
            if (inputVal === correctPwd) {
                document.getElementById(`gate-${idx}`).style.display = 'none';
                document.getElementById(`memo-content-${idx}`).style.display = 'block';
            } else {
                alert('パスワードが違います。');
            }
        };

        function formatBirthday(rawStr) {
            if (!rawStr) return '-';
            const match = rawStr.match(/(?:19|20)?\d{0,2}[\/\-年\s]*(\d{1,2})[\/\-月\s]+(\d{1,2})/);
            if (match) return `${parseInt(match[1], 10)}月${parseInt(match[2], 10)}日`;
            const match2 = rawStr.match(/^(\d{1,2})[\/\-月\s]+(\d{1,2})/);
            if (match2) return `${parseInt(match2[1], 10)}月${parseInt(match2[2], 10)}日`;
            return rawStr;
        }

        function formatScenarioDate(rawStr) {
            if (!rawStr) return '未定';
            const match = rawStr.match(/(\d{4})[\/\-年\s]+(\d{1,2})[\/\-月\s]+(\d{1,2})/);
            if (match) return `${match[1]}年${match[2]}月${match[3]}日`;
            return rawStr; 
        }

        function exportCCfolia(exportAllSkills) {
            const str = getNum('base-STR')+getNum('bonus-STR')+getNum('temp-STR');
            const con = getNum('base-CON')+getNum('bonus-CON')+getNum('temp-CON');
            const pow = getNum('base-POW')+getNum('bonus-POW')+getNum('temp-POW');
            const dex = getNum('base-DEX')+getNum('bonus-DEX')+getNum('temp-DEX');
            const app = getNum('base-APP')+getNum('bonus-APP')+getNum('temp-APP');
            const siz = getNum('base-SIZ')+getNum('bonus-SIZ')+getNum('temp-SIZ');
            const int = getNum('base-INT')+getNum('bonus-INT')+getNum('temp-INT');
            const edu = getNum('base-EDU')+getNum('bonus-EDU')+getNum('temp-EDU');

            const mythos = getNum('skill-mythos') + getNum('sk-oth-神話');
            const maxSan = 99 - mythos;
            const san = getNum('san-input') || (pow * 5);
            const hp = Math.ceil((con + siz) / 2);

            let commands = `1d100<={SAN} 【正気度ロール】\nCCB<={アイデア} 【アイデア】\nCCB<={幸運} 【幸運】\nCCB<={知識} 【知識】\n`;
            
            const initVals = { "回避": dex*2, "母国語": edu*5, "キック": 25, "組み付き": 25, "こぶし": 50, "投擲": 25, "応急手当": 30, "聞き耳": 25, "図書館": 25, "目星": 25, "運転": 20, "機械修理": 20, "水泳": 25, "跳躍": 25, "説得": 25, "歴史": 20 };
            let skillSet = new Set(["回避","キック","組み付き","こぶし","投擲","応急手当","聞き耳","図書館","目星","運転","機械修理","水泳","跳躍","説得","歴史","母国語"]);
            Object.keys(window.char).forEach(key => { if(key.match(/^sk-(job|int|gro|oth)-/)) skillSet.add(key.replace(/^sk-(job|int|gro|oth)-/, '')); });

            skillSet.forEach(sk => {
                let init = initVals[sk] || (["頭突き","隠れる","忍び歩き","写真術","追跡","電気修理","ナビゲート","経理","博物学"].includes(sk) ? 10 : (["乗馬","製作","言いくるめ","値切り","医学","オカルト","芸術","心理学","法律"].includes(sk) ? 5 : 1));
                let job = getNum(`sk-job-${sk}`), intP = getNum(`sk-int-${sk}`), gro = getNum(`sk-gro-${sk}`), oth = getNum(`sk-oth-${sk}`);
                let total = init + job + intP + gro + oth;

                if (exportAllSkills || total > init) {
                    commands += `CCB<=${total} 【${sk}】\n`;
                }
            });

            if (mythos > 0) commands += `CCB<=${mythos} 【クトゥルフ神話】\n`;
            const iconUrl = window.viewMainImages.length > 0 ? window.viewMainImages[0].url : "";

            const ccfoliaData = {
                kind: "character",
                data: {
                    name: getVal('name') || "無名の探索者",
                    memo: `職業: ${getVal('char-job')}\n年齢: ${getVal('char-age')}`,
                    initiative: dex,
                    externalUrl: window.location.href,
                    iconUrl: iconUrl,
                    commands: commands,
                    status: [
                        { label: "HP", value: hp, max: hp },
                        { label: "MP", value: pow, max: pow },
                        { label: "SAN", value: san, max: maxSan }
                    ],
                    params: [
                        { label: "STR", value: String(str) }, { label: "CON", value: String(con) },
                        { label: "POW", value: String(pow) }, { label: "DEX", value: String(dex) },
                        { label: "APP", value: String(app) }, { label: "SIZ", value: String(siz) },
                        { label: "INT", value: String(int) }, { label: "EDU", value: String(edu) },
                        { label: "アイデア", value: String(int*5) }, { label: "幸運", value: String(pow*5) }, { label: "知識", value: String(edu*5) }
                    ]
                }
            };

            navigator.clipboard.writeText(JSON.stringify(ccfoliaData));
            alert(exportAllSkills ? "ココフォリア形式(全技能)でコピーしました！" : "ココフォリア形式(変更した技能のみ)でコピーしました！");
            closeExportModal();
        }

        function renderView() {
            let initImgUrl = '', initImgDesc = '';
            let prevBtn = '', nextBtn = '';
            if (window.viewMainImages.length > 0) {
                initImgUrl = window.viewMainImages[0].url;
                initImgDesc = window.viewMainImages[0].desc;
                if (window.viewMainImages.length > 1) {
                    prevBtn = '<button class="nav-btn left" onclick="changeImage(-1)">❮</button>';
                    nextBtn = '<button class="nav-btn right" onclick="changeImage(1)">❯</button>';
                }
            }

            let exprHTML = '';
            if (window.viewExprImages.length > 0) {
                exprHTML = `<div class="expr-container"><div class="expr-title">表情差分 (クリックでプレビュー)</div><div class="expr-list">`;
                window.viewExprImages.forEach(img => {
                    exprHTML += `<img src="${img.url}" class="expr-icon" title="${img.desc}" onclick="setPreviewImage('${img.url}', '${img.desc}')">`;
                });
                exprHTML += `</div></div>`;
            }

            const str = getNum('base-STR')+getNum('bonus-STR')+getNum('temp-STR');
            const siz = getNum('base-SIZ')+getNum('bonus-SIZ')+getNum('temp-SIZ');
            const mythos = getNum('skill-mythos') + getNum('sk-oth-神話');
            const san = getNum('san-input') || (getNum('base-POW')*5);
            const colorCode = getVal('char-color') || '#ffffff';

            document.getElementById('view-content').innerHTML = `
                <div class="layout-wrapper">
                    <div class="left-sidebar">
                        <div class="filter-panel">
                            <h3 class="filter-title">技能表示フィルター</h3>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="all" checked onchange="renderSkills()"> すべて表示</label>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="job_int" onchange="renderSkills()"> 職業・興味ポイント</label>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="gro_oth" onchange="renderSkills()"> 成長・その他</label>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="job_gro" onchange="renderSkills()"> 職業・興味・成長・その他</label>
                        </div>
                        <div class="color-panel">
                            <h3 class="filter-title">イメージカラー</h3>
                            <div class="color-display">
                                <div class="color-box" style="background-color: ${colorCode};"></div>
                                <div class="color-code">${colorCode}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="center-content">
                        <div class="left-col">
                            <div class="image-carousel">
                                ${prevBtn}
                                <img id="main-preview-img" src="${initImgUrl}" onerror="this.style.display='none'">
                                ${nextBtn}
                            </div>
                            <div class="img-desc" id="main-preview-desc">${initImgDesc}</div>
                            <div class="tag-area">タグ: ${getVal('char-tag') || 'なし'}</div>
                            ${exprHTML}
                        </div>
                        <div class="right-col">
                            <div class="name-section">
                                <div class="furigana">${getVal('char-furigana')}</div>
                                <div class="name">${getVal('name')}</div>
                            </div>
                            <div class="profile-grid">
                                <div class="profile-item"><span class="profile-label">職業</span><span class="profile-value">${getVal('char-job')}</span></div>
                                <div class="profile-item"><span class="profile-label">年齢</span><span class="profile-value">${getVal('char-age')}</span></div>
                                <div class="profile-item"><span class="profile-label">性別</span><span class="profile-value">${getVal('char-gender')}</span></div>
                                <div class="profile-item"><span class="profile-label">出身</span><span class="profile-value">${getVal('char-origin')}</span></div>
                                <div class="profile-item"><span class="profile-label">身長</span><span class="profile-value">${getVal('char-height')}</span></div>
                                <div class="profile-item"><span class="profile-label">体重</span><span class="profile-value">${getVal('char-weight')}</span></div>
                                <div class="profile-item"><span class="profile-label">髪の色</span><span class="profile-value">${getVal('char-hair')}</span></div>
                                <div class="profile-item"><span class="profile-label">瞳の色</span><span class="profile-value">${getVal('char-eyes')}</span></div>
                                <div class="profile-item"><span class="profile-label">肌の色</span><span class="profile-value">${getVal('char-skin')}</span></div>
                                <div class="profile-item"><span class="profile-label">誕生日</span><span class="profile-value">${formatBirthday(getVal('char-birthday'))}</span></div>
                                <div class="profile-item"><span class="profile-label">種族</span><span class="profile-value">${getVal('char-race')}</span></div>
                                <div class="profile-item"><span class="profile-label">最終学歴</span><span class="profile-value">${getVal('char-education')}</span></div>
                            </div>
                            <div class="stats-row">
                                <div class="stat-box"><div class="stat-label">STR</div><div class="stat-value">${str||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">CON</div><div class="stat-value">${getNum('base-CON')||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">POW</div><div class="stat-value">${getNum('base-POW')||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">DEX</div><div class="stat-value">${getNum('base-DEX')||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">APP</div><div class="stat-value">${getNum('base-APP')||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">SIZ</div><div class="stat-value">${siz||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">INT</div><div class="stat-value">${getNum('base-INT')||'-'}</div></div>
                                <div class="stat-box"><div class="stat-label">EDU</div><div class="stat-value">${getNum('base-EDU')||'-'}</div></div>
                            </div>
                            <div class="derived-stats">
                                <div class="derived-box san-box">SAN値 ${san}/${99-mythos}</div>
                                <div class="derived-box">HP ${Math.ceil((getNum('base-CON')+siz)/2) || '-'}</div>
                                <div class="derived-box">MP ${getNum('base-POW') || '-'}</div>
                                <div class="derived-box">アイデア ${getNum('base-INT')*5 || '-'}</div>
                                <div class="derived-box">幸運 ${getNum('base-POW')*5 || '-'}</div>
                                <div class="derived-box">知識 ${getNum('base-EDU')*5 || '-'}</div>
                            </div>
                            <table class="skill-table">
                                <thead id="skill-thead"></thead>
                                <tbody id="skill-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="right-sidebar" id="right-sidebar" style="display:none;"></div>
                </div>
            `;
            
            renderSkills();
            renderRightSidebar();
        }

        function renderSkills() {
            const filter = document.querySelector('input[name="skill-filter"]:checked').value;
            const initVals = { "回避": getNum('base-DEX')*2, "母国語": getNum('base-EDU')*5, "キック": 25, "組み付き": 25, "こぶし": 50, "投擲": 25, "応急手当": 30, "聞き耳": 25, "図書館": 25, "目星": 25, "運転": 20, "機械修理": 20, "水泳": 25, "跳躍": 25, "説得": 25, "歴史": 20 };
            
            document.getElementById('skill-thead').innerHTML = `<tr><th class="skill-name">技能名</th><th>初期</th><th>職業</th><th>興味</th><th>成長</th><th>その他</th><th>合計</th></tr>`;

            let skillSet = new Set(["回避","キック","組み付き","こぶし","投擲","応急手当","聞き耳","図書館","目星","運転","機械修理","水泳","跳躍","説得","歴史","母国語"]);
            Object.keys(window.char).forEach(key => { if(key.match(/^sk-(job|int|gro|oth)-/)) skillSet.add(key.replace(/^sk-(job|int|gro|oth)-/, '')); });

            let rows = "";
            skillSet.forEach(sk => {
                let job = getNum(`sk-job-${sk}`), intP = getNum(`sk-int-${sk}`), gro = getNum(`sk-gro-${sk}`), oth = getNum(`sk-oth-${sk}`);
                let show = (filter === 'all') || 
                           (filter === 'job_int' && (job > 0 || intP > 0)) || 
                           (filter === 'gro_oth' && (gro > 0 || oth > 0)) || 
                           (filter === 'job_gro' && (job > 0 || intP > 0 || gro > 0 || oth > 0));
                
                if (show) {
                    rows += `<tr>
                        <td class="skill-name">${sk}</td>
                        <td>${initVals[sk] || 1}</td>
                        <td>${job||''}</td>
                        <td>${intP||''}</td>
                        <td>${gro||''}</td>
                        <td>${oth||''}</td>
                        <td class="skill-total">${(initVals[sk]||1)+job+intP+gro+oth}</td>
                    </tr>`;
                }
            });
            document.getElementById('skill-tbody').innerHTML = rows;
        }

        function renderRightSidebar() {
            let rsHTML = "";

            if (window.char.weapons && window.char.weapons.length > 0) {
                let wRows = window.char.weapons.map(w => `<tr><td>${w.name}</td><td>${w.rate}</td><td>${w.damage}</td><td>${w.range}</td><td>${w.attacks}</td><td>${w.ammo}</td><td>${w.hp}</td><td>${w.malf}</td><td>${w.other}</td></tr>`).join('');
                rsHTML += `
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">戦闘・武器・防具 <span>▼</span></div>
                        <div class="accordion-content" style="padding: 0; overflow-x: auto;">
                            <table class="data-table">
                                <tr><th>名称</th><th>成功率</th><th>ダメージ</th><th>射程</th><th>回数</th><th>装弾</th><th>耐久</th><th>故障</th><th>他</th></tr>
                                ${wRows}
                            </table>
                        </div>
                    </div>`;
            }

            let itemContent = "";
            if (window.char.money || window.char.debt) {
                itemContent += `<div style="margin-bottom:10px; padding:10px; background:#202225; border-radius:4px; font-weight:bold; color:#fff;">💰 所持金: ${window.char.money || '0'} / 借金: ${window.char.debt || '0'}</div>`;
            }
            if (window.char.items && window.char.items.length > 0) {
                let iRows = window.char.items.map(i => `<tr><td>${i.name}</td><td>${i.unitPrice}</td><td>${i.quantity}</td><td>${i.totalPrice}</td><td>${i.notes}</td></tr>`).join('');
                itemContent += `
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <tr><th>名称</th><th>単価</th><th>個数</th><th>価格</th><th>備考</th></tr>
                            ${iRows}
                        </table>
                    </div>`;
            }
            if (itemContent) {
                rsHTML += `
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">所持品・所持金 <span>▼</span></div>
                        <div class="accordion-content">${itemContent}</div>
                    </div>`;
            }

            if (window.char.scenarios && window.char.scenarios.length > 0) {
                let sRows = window.char.scenarios.map(s => `
                    <div style="padding:8px 0; border-bottom:1px solid #4f545c;">
                        <span style="color:#bb86fc; font-size:12px; margin-right:15px;">${formatScenarioDate(s.date)}</span><span style="color:#fff; font-weight:bold;">${s.name}</span>
                        ${s.memo ? `<div style="margin-top:5px; color:#b9bbbe; font-size:12px; white-space:pre-wrap; padding-left:10px; border-left:2px solid #4f545c;">${s.memo}</div>` : ''}
                    </div>`).join('');
                rsHTML += `
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">通過シナリオ <span>▼</span></div>
                        <div class="accordion-content" style="padding: 5px 15px;">${sRows}</div>
                    </div>`;
            }

            if (window.char.memos && window.char.memos.length > 0) {
                window.char.memos.forEach((m, idx) => {
                    let mContent = '';
                    if (m.password) {
                        mContent = `
                            <div id="gate-${idx}" style="display:flex; gap:10px; align-items:center; padding:10px; background:#202225; border-radius:4px;">
                                <span style="font-size:16px;">🔒</span>
                                <input type="text" id="pwd-input-${idx}" placeholder="パスワードを入力" style="padding:6px; border-radius:4px; border:1px solid #4f545c; background:#14161a; color:#fff; outline:none;">
                                <button onclick="unlockMemo(${idx}, '${m.password}')" style="padding:6px 12px; background:#43b581; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">解除</button>
                            </div>
                            <div id="memo-content-${idx}" style="display:none; white-space:pre-wrap; color:#b9bbbe;">${m.content}</div>
                        `;
                    } else {
                        mContent = `<div style="white-space:pre-wrap; color:#b9bbbe;">${m.content}</div>`;
                    }
                    rsHTML += `
                        <div class="accordion-item">
                            <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">${m.title} <span>▼</span></div>
                            <div class="accordion-content">${mContent}</div>
                        </div>`;
                });
            }

            const rsContainer = document.getElementById('right-sidebar');
            if (rsHTML) {
                rsContainer.innerHTML = rsHTML;
                rsContainer.style.display = 'flex';
            } else {
                rsContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
