<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャラクター閲覧 - Cthulhu Architect</title>
    <style>
        body { background-color: #36393f; color: #dcddde; margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #202225; padding-bottom: 15px; }
        .header-bar h2 { margin: 0; color: #fff; }
        .header-actions { display: flex; gap: 10px; }
        .btn-new, .btn-action { background: #4f545c; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .btn-new:hover, .btn-action:hover { background: #686d73; }
        .btn-action.export { background: #007bff; } .btn-action.export:hover { background: #0056b3; }
        .btn-action.edit { background: #28a745; } .btn-action.edit:hover { background: #218838; }

        .layout-wrapper { display: flex; gap: 30px; max-width: 1800px; margin: 0 auto; align-items: flex-start; justify-content: center; }
        
        .left-sidebar { flex: 0 0 220px; position: sticky; top: 20px; }
        .filter-panel {
            background: #2f3136;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 230px;
        }
        .filter-title { margin-top: 0; color: #b9bbbe; font-size: 14px; border-bottom: 1px solid #4f545c; padding-bottom: 8px; margin-bottom: 12px; text-align: center; }
        .filter-label { display: block; color: #dcddde; font-size: 14px; margin-bottom: 10px; cursor: pointer; padding: 10px; border-radius: 4px; transition: 0.2s; font-weight: bold; }
        .filter-label:hover { background: #36393f; }
        .filter-label input { margin-right: 8px; accent-color: #6366f1; transform: scale(1.2); }

        .center-content { flex: 0 1 1200px; display: flex; gap: 30px; background: #2f3136; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .left-col { flex: 0 0 460px; display: flex; flex-direction: column; gap: 15px; }
        .right-col { flex: 1 1 auto; display: flex; flex-direction: column; gap: 25px; }

        .image-carousel { position: relative; width: 100%; height: 580px; background: #202225; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #4f545c; overflow: hidden; }
        .image-carousel img { width: 100%; height: 100%; object-fit: contain; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 20px; width: 40px; height: 40px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .nav-btn:hover { background: rgba(0,0,0,0.9); }
        .nav-btn.left { left: 10px; } .nav-btn.right { right: 10px; }
        .img-desc { font-size: 14px; color: #b9bbbe; text-align: center; font-weight: bold; min-height: 20px; }
        .tag-area { font-size: 14px; color: #fff; background: #202225; padding: 10px 15px; border-radius: 4px; border: 1px solid #4f545c; text-align: center; }

        .expr-container { border-top: 1px solid #4f545c; padding-top: 20px; margin-top: 10px; }
        .expr-title { font-size: 14px; color: #b9bbbe; font-weight: bold; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .expr-list { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
        .expr-icon { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #36393f; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #000; position: relative; z-index: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .expr-icon:not(:first-child) { margin-top: -30px; }
        .expr-icon:nth-child(odd) { transform: translateX(-40px); }
        .expr-icon:nth-child(even) { transform: translateX(40px); }
        .expr-icon:nth-child(odd):hover { border-color: #6366f1; transform: translateX(-40px) scale(1.1); z-index: 10; box-shadow: 0 8px 15px rgba(99,102,241,0.4); }
        .expr-icon:nth-child(even):hover { border-color: #6366f1; transform: translateX(40px) scale(1.1); z-index: 10; box-shadow: 0 8px 15px rgba(99,102,241,0.4); }

        .right-sidebar { flex: 0 0 320px; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .accordion-item { background: #2f3136; border-radius: 4px; border: 1px solid #4f545c; }
        .accordion-header { padding: 12px 15px; color: #dcddde; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #202225; transition: 0.2s; user-select: none; }
        .accordion-header:hover { background: #36393f; }
        .accordion-header span { font-size: 12px; transition: transform 0.3s; }
        .accordion-item.open .accordion-header span { transform: rotate(-90deg); }
        .accordion-content { padding: 15px; font-size: 13px; color: #b9bbbe; line-height: 1.6; display: none; border-top: 1px solid #4f545c; white-space: pre-wrap; }
        .accordion-item.open .accordion-content { display: block; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index: 9999; }
        .modal-content { background:#1e1e24; padding:20px; border-radius:8px; border:1px solid #6366f1; width: 350px; display: flex; flex-direction: column; gap: 10px;}
        .modal-content h3 { color: white; margin-top: 0; text-align: center;}
        .btn-select { background: #4f545c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-select:hover { background: #686d73; }
        .btn-select.cancel { background: #f04747; margin-top: 10px;} .btn-select.cancel:hover { background: #d84040; }

        .name-section { text-align: center; border-bottom: 2px solid #4f545c; padding-bottom: 15px; }
        .furigana { font-size: 14px; color: #b9bbbe; letter-spacing: 2px; }
        .name { font-size: 36px; font-weight: bold; color: #fff; margin: 5px 0; letter-spacing: 2px; }
        .profile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; border-bottom: 2px solid #4f545c; padding-bottom: 15px; }
        .profile-item { display: flex; flex-direction: column; padding: 0 10px; border-right: 1px solid #4f545c; }
        .profile-item:nth-child(4n) { border-right: none; }
        .profile-label { color: #b9bbbe; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .profile-value { color: #fff; font-weight: bold; font-size: 15px; }
        .stats-row { display: flex; justify-content: space-between; text-align: center; border-bottom: 2px solid #4f545c; padding-bottom: 15px; }
        .stat-box { flex: 1; }
        .stat-label { font-size: 13px; color: #b9bbbe; font-weight: bold; margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #fff; }
        .derived-stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .derived-box { border: 1px solid #b9bbbe; padding: 6px 20px; border-radius: 4px; font-weight: bold; font-size: 14px; background: #202225; }
        .derived-box.san-box { border-color: #fff; }
        .skill-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; background: #202225; border-radius: 8px; overflow: hidden; }
        .skill-table th { background: #18191c; padding: 10px; border-bottom: 2px solid #4f545c; color: #b9bbbe; }
        .skill-table td { padding: 8px 10px; border-bottom: 1px solid #36393f; color: #dcddde; }
        .skill-name { text-align: left; font-weight: bold; color: #fff; }
        .skill-total { font-weight: bold; color: #5ce1e6; background: #2f3136; }
    </style>
</head>
<body>
    <div id="view-content"></div>
    <script>
        const index = localStorage.getItem('viewingIndex');
        const chars = JSON.parse(localStorage.getItem('characters') || '[]');
        const char = chars[index];
        let viewMainImages = char?.mainImages || char?.images || [];
        let viewExprImages = char?.exprImages || [];
        
        function getVal(key) { return char[key] || ''; }
        function getNum(key) { return parseInt(char[key]) || 0; }
        function renderView() {
            let exprHTML = viewExprImages.length > 0 ? `<div class="expr-container"><div class="expr-title">表情差分 (クリックでプレビュー)</div><div class="expr-list">` + viewExprImages.map(img => `<img src="${img.url}" class="expr-icon" onclick="setPreviewImage('${img.url}', '${img.desc}')">`).join('') + `</div></div>` : '';
            const str = getNum('base-STR')+getNum('bonus-STR')+getNum('temp-STR');
            const siz = getNum('base-SIZ')+getNum('bonus-SIZ')+getNum('temp-SIZ');
            const san = getNum('san-input') || (getNum('base-POW')*5);

            document.getElementById('view-content').innerHTML = `
                <div class="layout-wrapper">
                    <div class="left-sidebar">
                        <div class="filter-panel">
                            <h3 class="filter-title">技能表示フィルター</h3>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="all" checked onchange="renderSkills()"> すべて表示</label>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="job_int" onchange="renderSkills()"> 職業・興味ポイント</label>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="gro_oth" onchange="renderSkills()"> 成長・その他</label>
                            <label class="filter-label"><input type="radio" name="skill-filter" value="job_gro" onchange="renderSkills()"> 職業・興味・成長・その他</label>
                        </div>
                    </div>
                    <div class="center-content">
                        <div class="left-col">
                            <div class="image-carousel"><img id="main-preview-img" src="${viewMainImages[0]?.url || ''}"></div>
                            ${exprHTML}
                        </div>
                        <div class="right-col">
                            <div class="name-section"><div class="name">${getVal('name')}</div></div>
                            <table class="skill-table">
                                <thead id="skill-thead"></thead>
                                <tbody id="skill-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="right-sidebar" id="right-sidebar" style="display:none;"><div id="memo-container"></div></div>
                </div>
            `;
            renderSkills();
            renderMemos();
        }

        function renderSkills() {
            const filter = document.querySelector('input[name="skill-filter"]:checked').value;
            const initVals = { "回避": getNum('base-DEX')*2, "母国語": getNum('base-EDU')*5, "キック": 25, "組み付き": 25, "こぶし": 50, "投擲": 25, "応急手当": 30, "聞き耳": 25, "図書館": 25, "目星": 25, "運転": 20, "機械修理": 20, "水泳": 25, "跳躍": 25, "説得": 25, "歴史": 20 };
            
            let theadHTML = `<tr><th class="skill-name">技能名</th><th>初期</th>`;
            if (filter !== 'gro_oth') theadHTML += `<th>職業</th><th>興味</th>`;
            if (filter !== 'job_int') theadHTML += `<th>成長</th><th>その他</th>`;
            theadHTML += `<th>合計</th></tr>`;
            document.getElementById('skill-thead').innerHTML = theadHTML;

            let skillSet = new Set(["回避","キック","組み付き","こぶし","投擲","応急手当","聞き耳","図書館","目星","運転","機械修理","水泳","跳躍","説得","歴史","母国語"]);
            Object.keys(char).forEach(key => { if(key.match(/^sk-(job|int|gro|oth)-/)) skillSet.add(key.replace(/^sk-(job|int|gro|oth)-/, '')); });

            let rows = "";
            skillSet.forEach(sk => {
                let job = getNum(`sk-job-${sk}`), intP = getNum(`sk-int-${sk}`), gro = getNum(`sk-gro-${sk}`), oth = getNum(`sk-oth-${sk}`);
                let show = (filter === 'all') || (filter === 'job_int' && (job > 0 || intP > 0)) || (filter === 'gro_oth' && (gro > 0 || oth > 0)) || (filter === 'job_gro' && (job > 0 || intP > 0 || gro > 0 || oth > 0));
                
                if (show) {
                    rows += `<tr><td class="skill-name">${sk}</td><td>${initVals[sk] || 1}</td>`;
                    if (filter !== 'gro_oth') rows += `<td>${job||''}</td><td>${intP||''}</td>`;
                    if (filter !== 'job_int') rows += `<td>${gro||''}</td><td>${oth||''}</td>`;
                    rows += `<td class="skill-total">${(initVals[sk]||1)+job+intP+gro+oth}</td></tr>`;
                }
            });
            document.getElementById('skill-tbody').innerHTML = rows;
        }

        function renderMemos() {
            const memoConfig = [{ id: 'char-history', title: '知識・経験' }, { id: 'char-memo', title: 'メモ' }];
            let html = "";
            memoConfig.forEach(c => { if(char[c.id]) html += `<div class="accordion-item"><div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">${c.title}<span>❮</span></div><div class="accordion-content">${char[c.id]}</div></div>`; });
            if(html) { document.getElementById('memo-container').innerHTML = html; document.getElementById('right-sidebar').style.display = 'flex'; }
        }
        renderView();
    </script>
</body>
</html>
