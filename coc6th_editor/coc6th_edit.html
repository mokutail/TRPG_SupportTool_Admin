<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="basic_information/basic_information.css">
    <link rel="stylesheet" href="ability_value/ability_value.css">
    <link rel="stylesheet" href="skill_value/skill_value.css">
    <title>キャラクター作成 - CoC 6th</title>
</head>
<body>
    <header class="editor-header">
        <a href="../index.html" class="back-link">← 玄関に戻る</a>
        <h1 class="editor-title">キャラクター作成</h1>
    </header>

    <main class="editor-main">
        <form id="char-editor">
            
            <div id="component-info-value"></div>

            <div id="component-ability-value"></div>

            <div class="ability-control-bar">
                <button type="button" class="btn-random-all" onclick="rollAll()">一斉ランダム</button>
            </div>

            <div id="component-skills-list"></div>

            <div id="js-tooltip" class="custom-tooltip"></div>

            <div class="control-footer">
                <button type="button" class="btn-submit" onclick="saveCharacter()">保存して玄関に戻る</button>
            </div>
        </form>
    </main>

    <script src="basic_information/basic_information.js"></script>
    <script src="skill_value/skill_value.js"></script>
    <script src="ability_value/ability_value.js"></script>

    <script>
        // 1. ページを開いたときにデータをフォームに入れる処理
        document.addEventListener("DOMContentLoaded", () => {
            const editIndex = localStorage.getItem('editingIndex');
            
            if (editIndex !== null && editIndex !== "") {
                const chars = JSON.parse(localStorage.getItem('characters') || '[]');
                const char = chars[parseInt(editIndex, 10)];
                
                // データを各入力欄にセットする
                if (char) {
                    if (document.getElementById("char-name-new")) document.getElementById("char-name-new").value = char.name || "";
                    if (document.getElementById("char-furigana")) document.getElementById("char-furigana").value = char.furigana || "";
                    if (document.getElementById("char-tag")) document.getElementById("char-tag").value = char.tag || "";
                    if (document.getElementById("char-job")) document.getElementById("char-job").value = char.job || "";
                    if (document.getElementById("char-age")) document.getElementById("char-age").value = char.age || "";
                    if (document.getElementById("char-gender")) document.getElementById("char-gender").value = char.gender || "";
                    if (document.getElementById("char-height")) document.getElementById("char-height").value = char.height || "";
                    if (document.getElementById("char-weight")) document.getElementById("char-weight").value = char.weight || "";
                    if (document.getElementById("char-origin")) document.getElementById("char-origin").value = char.origin || "";
                    if (document.getElementById("char-hair")) document.getElementById("char-hair").value = char.hair || "";
                    if (document.getElementById("char-eyes")) document.getElementById("char-eyes").value = char.eyes || "";
                    if (document.getElementById("char-skin")) document.getElementById("char-skin").value = char.skin || "";
                    if (document.getElementById("char-birthday")) document.getElementById("char-birthday").value = char.birthday || "";
                    if (document.getElementById("char-race")) document.getElementById("char-race").value = char.race || "";
                    if (document.getElementById("char-education")) document.getElementById("char-education").value = char.education || "";
                }
                // ※ ここで removeItem はしません。保存するときに消します。
            }
        });

        // 2. 保存ボタンを押したときの処理
        function saveCharacter() {
            const chars = JSON.parse(localStorage.getItem('characters') || '[]');
            const editIndex = localStorage.getItem('editingIndex');
            
            // 画面の入力内容をすべて集める
            const newData = {
                name: document.getElementById("char-name-new")?.value || "無名の探索者",
                furigana: document.getElementById("char-furigana")?.value || "",
                tag: document.getElementById("char-tag")?.value || "",
                job: document.getElementById("char-job")?.value || "",
                age: document.getElementById("char-age")?.value || "",
                gender: document.getElementById("char-gender")?.value || "",
                height: document.getElementById("char-height")?.value || "",
                weight: document.getElementById("char-weight")?.value || "",
                origin: document.getElementById("char-origin")?.value || "",
                hair: document.getElementById("char-hair")?.value || "",
                eyes: document.getElementById("char-eyes")?.value || "",
                skin: document.getElementById("char-skin")?.value || "",
                birthday: document.getElementById("char-birthday")?.value || "",
                race: document.getElementById("char-race")?.value || "",
                education: document.getElementById("char-education")?.value || ""
            };

            if (editIndex !== null && editIndex !== "") {
                // 編集モードならその場所を上書き
                chars[parseInt(editIndex, 10)] = newData;
                // 保存が終わったら編集モードを解除
                localStorage.removeItem('editingIndex');
            } else {
                // 新規作成なら一番後ろに追加
                chars.push(newData);
            }

            // データを保存して玄関に戻る
            localStorage.setItem('characters', JSON.stringify(chars));
            alert("保存しました！");
            window.location.href = "../index.html";
        }
    </script>
</body>
</html>
