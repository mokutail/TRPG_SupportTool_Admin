<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="basic_information/basic_information.css">
    <link rel="stylesheet" href="ability_value/ability_value.css">
    <link rel="stylesheet" href="skill_value/skill_value.css">
    <title>キャラクター作成 - CoC 6th</title>
    <style>
        /* --- ヘッダーの追従スタイル --- */
        body { margin: 0; padding-bottom: 50px; background-color: #36393f; color: #dcddde; font-family: 'Segoe UI', sans-serif; }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #36393f;
            padding: 15px 40px;
            border-bottom: 1px solid #202225;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .editor-title { margin: 0; color: #fff; font-size: 24px; }
        
        .btn-submit {
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            border: none;
            color: white;
            background: #43b581;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #3ca374; }

        /* ② 左側の固定メニュー */
        .fixed-left-menu {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        .fixed-left-menu button {
            background: #2f3136;
            color: #fff;
            border: 1px solid #4f545c;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: 0.2s;
            line-height: 1.2;
        }
        .fixed-left-menu button:hover {
            background: #4f545c;
            border-color: #bb86fc;
            color: #bb86fc;
            transform: scale(1.1);
        }
        .editor-main { padding: 20px 40px 20px 90px; } /* 左メニュー分の余白を確保 */

        /* ④ CSSの !important 競合を上書きして折りたたみを有効化 */
        .info-content-wrapper[style*="display: none"],
        .accordion-content[style*="display: none"] {
            display: none !important;
        }

        /* ⑤ デザイン統一用コンテナ（基本情報・技能セクションと同じ） */
        .custom-section { 
            max-width: 1300px; width: 100%; background-color: #1e2227; 
            border: 1px solid #323842; border-radius: 6px; padding: 20px; 
            margin-bottom: 25px; display: flex; flex-direction: column; box-sizing: border-box; 
        }

        .dynamic-row { background: #252a31; border: 1px solid #3e4452; border-radius: 6px; padding: 15px; margin-bottom: 10px; position: relative; }
        .row-controls { display: flex; gap: 5px; margin-bottom: 10px; justify-content: flex-end; }
        .row-controls button { background: #3e4452; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .row-controls button:hover { background: #5c6370; }
        .row-controls button.btn-del { background: #f04747; }
        .row-controls button.btn-del:hover { background: #d84040; }

        .grid-inputs { display: grid; gap: 10px; }
        .grid-inputs label { font-size: 13px; color: #aaa; display: flex; flex-direction: column; gap: 4px; }
        .grid-inputs input, .grid-inputs textarea { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; outline: none; }
        .grid-inputs input[type="date"] { cursor: pointer; color: #fff; }
        .grid-inputs input:focus, .grid-inputs textarea:focus { border-color: #bb86fc; }

        input[type="color"] { cursor: pointer; border: none; background: transparent; width: 60px; height: 35px; padding: 0; border-radius: 4px; }

        .weapon-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .weapon-grid-bottom { grid-template-columns: repeat(6, 1fr); }
        .item-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .item-grid-bottom { grid-template-columns: 1fr 3fr; }
        .scenario-grid { grid-template-columns: 1fr 2fr; }

        .btn-add-row { background: transparent; border: 1px solid #4c566a; color: #d8dee9; padding: 10px; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; margin-top: 5px; transition: 0.2s;}
        .btn-add-row:hover { background: #3b4252; color: #fff; }

        .memo-grid-top { grid-template-columns: 1fr auto; align-items: end; }
        
        .money-fixed-box { display: flex; gap: 20px; background: #252a31; padding: 15px; border-radius: 6px; border: 1px solid #3e4452; margin-top: 15px; margin-bottom: 10px; }
        .money-fixed-box label { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: bold; font-size: 14px; }
        .money-fixed-box input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px 10px; border-radius: 4px; width: 150px; outline: none; }

        /* パスワードモーダル */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e24; border: 1px solid #4f545c; border-radius: 8px; padding: 20px; width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { margin: 0; color: #fff; font-size: 16px; border-bottom: 1px solid #4f545c; padding-bottom: 10px; }
        .modal-content label { color: #aaa; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .modal-content input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-modal-save { background: #43b581; } .btn-modal-save:hover { background: #3ca374; }
        .btn-modal-cancel { background: #4f545c; } .btn-modal-cancel:hover { background: #686d73; }
    </style>
</head>
<body>
    <header class="editor-header">
        <h1 class="editor-title">キャラクター作成・編集</h1>
        <div class="header-actions">
            <button type="button" class="btn-submit" onclick="saveCharacter()">💾 保存する</button>
        </div>
    </header>

    <div class="fixed-left-menu">
        <button type="button" onclick="goToView()" title="閲覧画面へ">👁<br><span style="font-size:10px;">閲覧</span></button>
        <button type="button" onclick="window.location.href='../index.html'" title="玄関に戻る">🚪<br><span style="font-size:10px;">玄関</span></button>
    </div>

    <main class="editor-main">
        <form id="char-editor">
            
            <div id="component-info-value"></div>
            
            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('theme-area', this)">
                    <h2 class="section-subtitle">テーマ設定</h2><span class="accordion-icon">⋁</span>
                </div>
                <div id="theme-area" class="accordion-content open" style="display: flex; flex-direction: row; align-items: center; gap: 20px;">
                    <label style="color: #b9bbbe; font-size: 14px; font-weight: bold;">イメージカラー:</label>
                    <input type="color" id="char-color" name="char-color" value="#ffffff" title="キャラクターのテーマカラーを選択">
                </div>
            </div>

            <div id="component-ability-value"></div>
            <div class="ability-control-bar">
                <button type="button" class="btn-random-all" onclick="rollAll()">一斉ランダム</button>
            </div>
            
            <div id="component-skills-list"></div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('weapons-area', this)">
                    <h2 class="section-subtitle">戦闘・武器・防具</h2><span class="accordion-icon">⋗</span>
                </div>
                <div id="weapons-area" class="accordion-content" style="display: none;">
                    <div id="weapons-container"></div>
                    <button type="button" class="btn-add-row" onclick="addWeaponRow()">+ 武器・防具を追加</button>
                </div>
            </div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('items-area', this)">
                    <h2 class="section-subtitle">所持品・所持金</h2><span class="accordion-icon">⋗</span>
                </div>
                <div id="items-area" class="accordion-content" style="display: none;">
                    <div class="money-fixed-box">
                        <label>現在の所持金 <input type="text" id="char-money" placeholder="例: 100,000円"></label>
                        <label>借金 <input type="text" id="char-debt" placeholder="例: 0円"></label>
                    </div>
                    <div id="items-container"></div>
                    <button type="button" class="btn-add-row" onclick="addItemRow()">+ 所持品を追加</button>
                </div>
            </div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('scenarios-area', this)">
                    <h2 class="section-subtitle">通過したシナリオ</h2><span class="accordion-icon">⋁</span>
                </div>
                <div id="scenarios-area" class="accordion-content open" style="display: flex;">
                    <div id="scenarios-container"></div>
                    <button type="button" class="btn-add-row" onclick="addScenarioRow()">+ シナリオ歴を追加</button>
                </div>
            </div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('memos-area', this)">
                    <h2 class="section-subtitle">詳細メモ（秘匿・バックストーリー等）</h2><span class="accordion-icon">⋁</span>
                </div>
                <div id="memos-area" class="accordion-content open" style="display: flex;">
                    <div id="memos-container"></div>
                    <button type="button" class="btn-add-row" onclick="addMemoRow()">+ 新しいメモを作成</button>
                </div>
            </div>

            <div id="js-tooltip" class="custom-tooltip"></div>
        </form>
    </main>

    <div id="pwd-modal" class="modal">
        <div class="modal-content">
            <h3>パスワード設定</h3>
            <p style="color:#aaa; font-size:12px; margin:0;">このメモを閲覧画面で保護します。</p>
            <label>パスワード (空欄で解除)<input type="text" id="modal-pwd-input" placeholder="パスワードを入力"></label>
            <div class="modal-actions">
                <button type="button" class="btn-modal-cancel" onclick="closePasswordModal()">キャンセル</button>
                <button type="button" class="btn-modal-save" onclick="applyPassword()">保存</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        window.db = db; window.doc = doc; window.setDoc = setDoc;
    </script>

    <script src="basic_information/basic_information.js"></script>
    <script src="skill_value/skill_value.js"></script>
    <script src="ability_value/ability_value.js"></script>

<script>
    // ② 閲覧画面への遷移
    function goToView() {
        const editIndex = localStorage.getItem('editingIndex');
        if (editIndex !== null && editIndex !== "") {
            localStorage.setItem('viewingIndex', editIndex);
            window.location.href = '../view.html';
        } else {
            alert('キャラクターが保存されていません。一度保存ボタンを押してください。');
        }
    }

    function moveUp(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
    }
    function moveDown(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
    }
    function deleteRow(btn) {
        if(confirm('この項目を削除しますか？')) btn.closest('.dynamic-row').remove();
    }

    function addWeaponRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row weapon-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs weapon-grid-top">
                <label>名称<input type="text" class="w-name" value="${data.name||''}"></label>
                <label>成功率<input type="text" class="w-rate" value="${data.rate||''}"></label>
                <label>ダメージ<input type="text" class="w-dmg" value="${data.damage||''}"></label>
            </div>
            <div class="grid-inputs weapon-grid-bottom" style="margin-top:8px;">
                <label>射程<input type="text" class="w-range" value="${data.range||''}"></label>
                <label>攻撃回数<input type="text" class="w-attacks" value="${data.attacks||''}"></label>
                <label>装弾数<input type="text" class="w-ammo" value="${data.ammo||''}"></label>
                <label>耐久力<input type="text" class="w-hp" value="${data.hp||''}"></label>
                <label>故障<input type="text" class="w-malf" value="${data.malf||''}"></label>
                <label>その他<input type="text" class="w-other" value="${data.other||''}"></label>
            </div>
        `;
        document.getElementById('weapons-container').appendChild(div);
    }

    function addItemRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row item-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs item-grid-top">
                <label>名称<input type="text" class="i-name" value="${data.name||''}"></label>
                <label>単価<input type="text" class="i-unit" value="${data.unitPrice||''}"></label>
                <label>個数<input type="text" class="i-qty" value="${data.quantity||''}"></label>
            </div>
            <div class="grid-inputs item-grid-bottom" style="margin-top:8px;">
                <label>価格 (自動/手動)<input type="text" class="i-total" value="${data.totalPrice||''}"></label>
                <label>効果・備考など<input type="text" class="i-notes" value="${data.notes||''}"></label>
            </div>
        `;
        document.getElementById('items-container').appendChild(div);
    }

    function addScenarioRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row scenario-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs scenario-grid">
                <label>完了日<input type="date" class="s-date" value="${data.date||''}"></label>
                <label>シナリオ名<input type="text" class="s-name" value="${data.name||''}"></label>
            </div>
            <div class="grid-inputs" style="margin-top: 8px;">
                <label>メモ（成長した技能やSAN値の減少など）<textarea class="s-memo" style="height: 60px; resize: vertical;" placeholder="減少したSAN値や手に入れたアーティファクト、成長技能などをメモ">${data.memo||''}</textarea></label>
            </div>
        `;
        document.getElementById('scenarios-container').appendChild(div);
    }

    let activePwdInput = null;
    function openPasswordModal(btn) {
        activePwdInput = btn.closest('.memo-row').querySelector('.m-pwd');
        document.getElementById('modal-pwd-input').value = activePwdInput.value;
        document.getElementById('pwd-modal').style.display = 'flex';
    }
    function closePasswordModal() { document.getElementById('pwd-modal').style.display = 'none'; activePwdInput = null; }
    function applyPassword() {
        if(activePwdInput) activePwdInput.value = document.getElementById('modal-pwd-input').value;
        closePasswordModal();
        activePwdInput.parentElement.querySelector('button').innerText = activePwdInput.value ? '🔒 保護中' : '🔑 パスワード設定';
    }

    function addMemoRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row memo-row';
        const hasPwd = data.password && data.password !== '';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs memo-grid-top">
                <label style="color:#bb86fc; font-weight:bold;">メモタイトル<input type="text" class="m-title" value="${data.title||''}" style="font-size:16px; border-color:#6366f1;"></label>
                <button type="button" onclick="openPasswordModal(this)" style="height:36px; padding:0 15px; background:#4f545c; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                    ${hasPwd ? '🔒 保護中' : '🔑 パスワード設定'}
                </button>
            </div>
            <textarea class="m-content" style="width:100%; height:150px; margin-top:10px; resize:vertical;" placeholder="詳細な情報を入力...">${data.content||''}</textarea>
            <input type="hidden" class="m-pwd" value="${data.password||''}">
        `;
        document.getElementById('memos-container').appendChild(div);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const editIndex = localStorage.getItem('editingIndex');
        if (editIndex !== null && editIndex !== "") {
            const chars = JSON.parse(localStorage.getItem('characters') || '[]');
            const char = chars[parseInt(editIndex, 10)];
            if (char) {
                window.charMainImages = char.mainImages || []; window.charExprImages = char.exprImages || [];
                if(typeof updateMainPreview === 'function') updateMainPreview();

                setTimeout(() => {
                    document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
                        let key = el.name || el.id;
                        if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
                        if (key && char[key] !== undefined) {
                            if (el.type === 'checkbox') el.checked = char[key]; else el.value = char[key];
                        }
                    });
                    if(char.money) document.getElementById('char-money').value = char.money;
                    if(char.debt) document.getElementById('char-debt').value = char.debt;

                    if (typeof calcAll === 'function') calcAll();
                    if (typeof calcSkills === 'function') calcSkills();
                }, 100);

                if(char.weapons) char.weapons.forEach(w => addWeaponRow(w));
                if(char.items) char.items.forEach(i => addItemRow(i));
                if(char.scenarios) char.scenarios.forEach(s => addScenarioRow(s));
                if(char.memos) char.memos.forEach(m => addMemoRow(m));
            }
        }
        
        if(document.getElementById('weapons-container').children.length === 0) addWeaponRow();
        if(document.getElementById('items-container').children.length === 0) addItemRow();
        if(document.getElementById('scenarios-container').children.length === 0) addScenarioRow();
        if(document.getElementById('memos-container').children.length === 0) addMemoRow({title: "基本設定メモ"});
    });

    async function saveCharacter() {
        const chars = JSON.parse(localStorage.getItem('characters') || '[]');
        const editIndex = localStorage.getItem('editingIndex');
        const newData = {};

        document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
            let key = el.name || el.id;
            if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
            if (key) newData[key] = el.type === 'checkbox' ? el.checked : el.value;
        });

        newData.mainImages = window.charMainImages || [];
        newData.exprImages = window.charExprImages || [];
        newData.name = document.getElementById("char-name-new")?.value || "無名の探索者";
        newData.money = document.getElementById("char-money").value;
        newData.debt = document.getElementById("char-debt").value;

        newData.weapons = Array.from(document.querySelectorAll('.weapon-row')).map(row => ({
            name: row.querySelector('.w-name').value, rate: row.querySelector('.w-rate').value, damage: row.querySelector('.w-dmg').value,
            range: row.querySelector('.w-range').value, attacks: row.querySelector('.w-attacks').value, ammo: row.querySelector('.w-ammo').value,
            hp: row.querySelector('.w-hp').value, malf: row.querySelector('.w-malf').value, other: row.querySelector('.w-other').value
        })).filter(w => w.name.trim() !== "");

        newData.items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
            name: row.querySelector('.i-name').value, unitPrice: row.querySelector('.i-unit').value, quantity: row.querySelector('.i-qty').value,
            totalPrice: row.querySelector('.i-total').value, notes: row.querySelector('.i-notes').value
        })).filter(i => i.name.trim() !== "");

        newData.scenarios = Array.from(document.querySelectorAll('.scenario-row')).map(row => ({
            date: row.querySelector('.s-date').value, 
            name: row.querySelector('.s-name').value,
            memo: row.querySelector('.s-memo').value
        })).filter(s => s.name.trim() !== "");

        newData.memos = Array.from(document.querySelectorAll('.memo-row')).map(row => ({
            title: row.querySelector('.m-title').value, content: row.querySelector('.m-content').value, password: row.querySelector('.m-pwd').value
        })).filter(m => m.title.trim() !== "" || m.content.trim() !== "");

        if (editIndex !== null && editIndex !== "") {
            newData.uid = chars[parseInt(editIndex, 10)].uid;
            chars[parseInt(editIndex, 10)] = newData;
        } else {
            newData.uid = 'char_' + Date.now().toString(16) + Math.random().toString(16).slice(2);
            chars.push(newData);
            localStorage.setItem('editingIndex', chars.length - 1);
        }

        try {
            if (window.setDoc && window.doc && window.db) {
                await window.setDoc(window.doc(window.db, "characters", newData.uid), newData);
            }
            localStorage.setItem('characters', JSON.stringify(chars));
            
            alert("保存しました！引き続き編集・または左のメニューから閲覧画面に移動できます。");
        } catch (e) {
            console.error("保存エラー:", e);
            alert("保存に失敗しました。容量制限または通信エラーの可能性があります。");
        }
    }
</script>

<script>
function diceRoll(num, size, add = 0) {
    let total = add;
    for (let i = 0; i < num; i++) {
        total += Math.floor(Math.random() * size) + 1;
    }
    return total;
}

const ABILITY_VALUE_COMPONENT = `
    <h2 class="section-subtitle">能力値一覧</h2>
    
    <div class="ability-table">
        <div class="table-row row-header">

        tooltip.style.top = `${rect.top + window.scrollY - tooltip.offsetHeight - 8}px`;

function rollIndividual(stat) {
    const select = document.querySelector(`select[name="base-${stat}"]`);
    if (!select) return;
    let result = 0;
    if (stat === 'STR' || stat === 'CON' || stat === 'POW' || stat === 'DEX' || stat === 'APP') { result = diceRoll(3, 6); }
    else if (stat === 'SIZ' || stat === 'INT') { result = diceRoll(2, 6, 6); }
    else if (stat === 'EDU') { result = diceRoll(3, 6, 3); }
    select.value = result;

    if (stat === 'POW') {
        hasManuallySetSan = false;
    }
    calcAll();
}

function rollAll() {
    hasManuallySetSan = false;
    ['STR', 'CON', 'POW', 'DEX', 'APP', 'SIZ', 'INT', 'EDU'].forEach(stat => rollIndividual(stat));
}

function calcAll() {
    const primaryStats = ['STR', 'CON', 'POW', 'DEX', 'APP', 'SIZ', 'INT', 'EDU'];
    const baseValues = {}; const currentValues = {};

    primaryStats.forEach(stat => {
        const selectEl = document.querySelector(`select[name="base-${stat}"]`);
        const base = selectEl ? (parseInt(selectEl.value) || 0) : 0;
        const bonus = parseInt(document.querySelector(`input[name="bonus-${stat}"]`)?.value) || 0;
        const temp = parseInt(document.querySelector(`input[name="temp-${stat}"]`)?.value) || 0;
        baseValues[stat] = base;
        currentValues[stat] = base === 0 ? 0 : (base + bonus + temp);
        const curEl = document.getElementById(`cur-${stat}`);
        if (curEl) curEl.textContent = base === 0 ? 0 : currentValues[stat];
    });

    const evadeInit = currentValues['DEX'] * 2;
    const evadeInitDisplay = document.getElementById('init-evade');
    if (evadeInitDisplay) {
        evadeInitDisplay.textContent = evadeInit;
        const row = evadeInitDisplay.closest('.skill-row');
        if (row) row.setAttribute('data-initial', evadeInit);
    }

    const nativeInit = currentValues['EDU'] * 5;
    const nativeInitDisplay = document.getElementById('init-native-lang');
    if (nativeInitDisplay) {
        nativeInitDisplay.textContent = nativeInit;
        const row = nativeInitDisplay.closest('.skill-row');
        if (row) row.setAttribute('data-initial', nativeInit);
    }

    const hasHP = baseValues['CON'] > 0 && baseValues['SIZ'] > 0;
    const hasMP = baseValues['POW'] > 0;
    const hasIDE = baseValues['INT'] > 0;
    const hasKnow = baseValues['EDU'] > 0;

    const BoneHP = hasHP ? Math.ceil((baseValues['CON'] + baseValues['SIZ']) / 2) : 0;
    document.getElementById('base-HP').textContent = hasHP ? BoneHP : "-";
    const bonusHP = parseInt(document.querySelector(`input[name="bonus-HP"]`)?.value) || 0;
    const tempHP = parseInt(document.querySelector(`input[name="temp-HP"]`)?.value) || 0;
    document.getElementById('cur-HP').textContent = hasHP ? (BoneHP + bonusHP + tempHP) : 0;

    const baseMP = hasMP ? baseValues['POW'] : 0;
    document.getElementById('base-MP').textContent = hasMP ? baseMP : "-";
    const bonusMP = parseInt(document.querySelector(`input[name="bonus-MP"]`)?.value) || 0;
    const tempMP = parseInt(document.querySelector(`input[name="temp-MP"]`)?.value) || 0;
    document.getElementById('cur-MP').textContent = hasMP ? (baseMP + bonusMP + tempMP) : 0;

    const baseSAN = hasMP ? baseValues['POW'] * 5 : 0;
    document.getElementById('base-SAN').textContent = hasMP ? baseSAN : "-";
    const bonusSAN = parseInt(document.querySelector(`input[name="bonus-SAN"]`)?.value) || 0;
    const tempSAN = parseInt(document.querySelector(`input[name="temp-SAN"]`)?.value) || 0;
    const totalSAN = hasMP ? (baseSAN + bonusSAN + tempSAN) : 0;
    document.getElementById('cur-SAN').textContent = totalSAN;

    const baseIDE = hasIDE ? baseValues['INT'] * 5 : 0;
    document.getElementById('base-IDE').textContent = hasIDE ? baseIDE : "-";
    const bonusIDE = parseInt(document.querySelector(`input[name="bonus-IDE"]`)?.value) || 0;
    const tempIDE = parseInt(document.querySelector(`input[name="temp-IDE"]`)?.value) || 0;
    document.getElementById('cur-IDE').textContent = hasIDE ? (baseIDE + bonusIDE + tempIDE) : 0;

    const baseLucky = hasMP ? baseValues['POW'] * 5 : 0;
    document.getElementById('base-幸運').textContent = hasMP ? baseLucky : "-";
    const bonusLucky = parseInt(document.querySelector(`input[name="bonus-幸運"]`)?.value) || 0;
    const tempLucky = parseInt(document.querySelector(`input[name="temp-幸運"]`)?.value) || 0;
    document.getElementById('cur-幸運').textContent = hasMP ? (baseLucky + bonusLucky + tempLucky) : 0;

    const baseKnow = hasKnow ? baseValues['EDU'] * 5 : 0;
    document.getElementById('base-知識').textContent = hasKnow ? baseKnow : "-";
    const bonusKnow = parseInt(document.querySelector(`input[name="bonus-知識"]`)?.value) || 0;
    const tempKnow = parseInt(document.querySelector(`input[name="temp-知識"]`)?.value) || 0;
    document.getElementById('cur-知識').textContent = hasKnow ? (baseKnow + bonusKnow + tempKnow) : 0;

    if (baseValues['STR'] === 0 || baseValues['SIZ'] === 0) {
        document.getElementById('db-display').textContent = "なし";
    } else {
        const sumDb = currentValues['STR'] + currentValues['SIZ'];
        let dbResult = "0";
        if (sumDb >= 2 && sumDb <= 12) { dbResult = "-1D6"; }
        else if (sumDb >= 13 && sumDb <= 16) { dbResult = "-1D4"; }
        else if (sumDb >= 17 && sumDb <= 24) { dbResult = "0"; }
        else if (sumDb >= 25 && sumDb <= 32) { dbResult = "+1D4"; }
        else if (sumDb >= 33 && sumDb <= 40) { dbResult = "+1D6"; }
        else if (sumDb >= 41 && sumDb <= 56) { dbResult = "+2D6"; }
        document.getElementById('db-display').textContent = dbResult;
    }

    let jobMax = 0;
    const jobMethod = document.getElementById('job-calc-method')?.value || "EDU*20";
    const jobBonus = parseInt(document.getElementById('job-points-bonus')?.value) || 0;

    if (jobMethod === "MANUAL") {
        jobMax = jobBonus;
    } else {
        if (jobMethod === "EDU*20") { jobMax = currentValues['EDU'] * 20; }
        else if (jobMethod === "STR*10+EDU*10") { jobMax = (currentValues['STR'] * 10) + (currentValues['EDU'] * 10); }
        else if (jobMethod === "CON*10+EDU*10") { jobMax = (currentValues['CON'] * 10) + (currentValues['EDU'] * 10); }
        else if (jobMethod === "POW*10+EDU*10") { jobMax = (currentValues['POW'] * 10) + (currentValues['EDU'] * 10); }
        else if (jobMethod === "DEX*10+EDU*10") { jobMax = (currentValues['DEX'] * 10) + (currentValues['EDU'] * 10); }
        else if (jobMethod === "APP*10+EDU*10") { jobMax = (currentValues['APP'] * 10) + (currentValues['EDU'] * 10); }
        else if (jobMethod === "SIZ*10+EDU*10") { jobMax = (currentValues['SIZ'] * 10) + (currentValues['EDU'] * 10); }
        else if (jobMethod === "INT*10+EDU*10") { jobMax = (currentValues['INT'] * 10) + (currentValues['EDU'] * 10); }
        jobMax += jobBonus;
    }

    const interestBonus = parseInt(document.getElementById('interest-points-bonus')?.value) || 0;
    const interestMax = (currentValues['INT'] * 10) + interestBonus;

    const jobMaxEl = document.getElementById('job-points-max');
    const interestMaxEl = document.getElementById('interest-points-max');
    if (jobMaxEl) jobMaxEl.textContent = `/ ${jobMax}`;
    if (interestMaxEl) interestMaxEl.textContent = `/ ${interestMax}`;

    const sanInput = document.getElementById('san-input');
    if (sanInput && !hasManuallySetSan) {
        if (!hasMP) { sanInput.value = ""; } else { sanInput.value = totalSAN; }
    }

    if (typeof calcSkills === "function" && document.querySelectorAll(".skill-row").length > 0) {
        calcSkills();
    }
}

window.addCustomSkill = function(btn, type) {
    const list = btn.closest('.accordion-content').querySelector('.skills-list');
    const uniqueId = Date.now() + Math.random().toString().slice(2, 6);
    const row = document.createElement('div');
    row.className = 'skill-row custom-added-skill';
    row.setAttribute('data-initial', '1');
    row.innerHTML = `
        <div class="s-col name-col" style="display:flex; align-items:center;">
            <input type="text" class="skill-name-inline custom-name-input" value="" placeholder="追加技能名" oninput="updateCustomSkillName(this, '${uniqueId}')" style="width:100px;">
            <button type="button" style="background:#f04747; color:#fff; border:none; padding:2px 8px; border-radius:4px; margin-left:5px; cursor:pointer;" onclick="this.parentElement.parentElement.remove(); calcSkills(); markAsChanged();">✖</button>
        </div>
        <div class="s-col val-col">
            <input type="number" class="custom-init-input" name="sk-init-custom_${uniqueId}" value="1" min="0" max="99" oninput="updateCustomSkillInit(this); calcSkills();" style="width:40px; background:transparent; border:1px solid #4f545c; color:#bb86fc; text-align:center; border-radius:4px; font-weight:bold;">
        </div>
        <div class="s-col input-col"><input type="number" name="sk-job-custom_${uniqueId}" oninput="calcSkills()"></div>
        <div class="s-col input-col"><input type="number" name="sk-int-custom_${uniqueId}" oninput="calcSkills()"></div>
        <div class="s-col input-col"><input type="number" name="sk-gro-custom_${uniqueId}" oninput="calcSkills()"></div>
        <div class="s-col input-col"><input type="number" name="sk-oth-custom_${uniqueId}" oninput="calcSkills()"></div>
        <div class="s-col total-col"><span class="skill-total">1</span></div>
    `;
    if (type === 'knowledge') {
        const mythosRow = list.querySelector('.skill-mythos-row');
        if (mythosRow) {
            list.insertBefore(row, mythosRow);
        } else {
            list.appendChild(row);
        }
    } else {
        list.appendChild(row);
    }
    markAsChanged();
};

window.updateCustomSkillName = function(inputEl, id) {
    const name = inputEl.value.trim() || `custom_${id}`;
    const row = inputEl.closest('.skill-row');
    row.querySelector('.custom-init-input').name = `sk-init-${name}`;
    row.querySelector('input[name^="sk-job-"]').name = `sk-job-${name}`;
    row.querySelector('input[name^="sk-int-"]').name = `sk-int-${name}`;
    row.querySelector('input[name^="sk-gro-"]').name = `sk-gro-${name}`;
    row.querySelector('input[name^="sk-oth-"]').name = `sk-oth-${name}`;
    markAsChanged();
};
window.updateCustomSkillInit = function(inputEl) {
    inputEl.closest('.skill-row').setAttribute('data-initial', inputEl.value || 0);
    markAsChanged();
};
</script>
