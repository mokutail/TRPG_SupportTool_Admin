<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="basic_information/basic_information.css">
    <link rel="stylesheet" href="ability_value/ability_value.css">
    <link rel="stylesheet" href="skill_value/skill_value.css">
    <title>キャラクター作成 - CoC 6th</title>
    <style>
        /* --- ヘッダーの追従スタイル --- */
        body { margin: 0; padding-bottom: 50px; background-color: #36393f; color: #dcddde; font-family: 'Segoe UI', sans-serif; }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #36393f;
            padding: 15px 40px;
            border-bottom: 1px solid #202225;
            position: relative; /* ① ヘッダーがスクロールについてこないように修正 */
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .editor-title { margin: 0; color: #fff; font-size: 24px; }
        
        /* ⑤ 保存ボタンを左側の固定メニューに追加 */
        .fixed-left-menu {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        .fixed-left-menu button {
            background: #2f3136;
            color: #fff;
            border: 1px solid #4f545c;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: 0.2s;
            line-height: 1.2;
        }
        .fixed-left-menu button:hover {
            background: #4f545c;
            border-color: #bb86fc;
            color: #bb86fc;
            transform: scale(1.1);
        }
        .editor-main { padding: 20px 40px 20px 90px; }

        .info-content-wrapper[style*="display: none"],
        .accordion-content[style*="display: none"] {
            display: none !important;
        }

        .custom-section { 
            max-width: 1300px; width: 100%; background-color: #1e2227; 
            border: 1px solid #323842; border-radius: 6px; padding: 20px; 
            margin-bottom: 25px; display: flex; flex-direction: column; box-sizing: border-box; 
        }

        .dynamic-row { background: #252a31; border: 1px solid #3e4452; border-radius: 6px; padding: 15px; margin-bottom: 10px; position: relative; }
        .row-controls { display: flex; gap: 5px; margin-bottom: 10px; justify-content: flex-end; }
        .row-controls button { background: #3e4452; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .row-controls button:hover { background: #5c6370; }
        .row-controls button.btn-del { background: #f04747; }
        .row-controls button.btn-del:hover { background: #d84040; }

        .grid-inputs { display: grid; gap: 10px; }
        .grid-inputs label { font-size: 13px; color: #aaa; display: flex; flex-direction: column; gap: 4px; }
        .grid-inputs input, .grid-inputs textarea { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; outline: none; }
        .grid-inputs input[type="date"] { cursor: pointer; color: #fff; }
        .grid-inputs input:focus, .grid-inputs textarea:focus { border-color: #bb86fc; }

        input[type="color"], input[type="checkbox"].theme-check { cursor: pointer; }
        input[type="color"] { border: none; background: transparent; width: 60px; height: 35px; padding: 0; border-radius: 4px; }

        .weapon-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .weapon-grid-bottom { grid-template-columns: repeat(6, 1fr); }
        .item-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .item-grid-bottom { grid-template-columns: 1fr 3fr; }
        .scenario-grid { grid-template-columns: 1fr 2fr; }

        .btn-add-row { background: transparent; border: 1px solid #4c566a; color: #d8dee9; padding: 10px; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; margin-top: 5px; transition: 0.2s;}
        .btn-add-row:hover { background: #3b4252; color: #fff; }

        .memo-grid-top { grid-template-columns: 1fr auto; align-items: end; }
        
        .money-fixed-box { display: flex; gap: 20px; background: #252a31; padding: 15px; border-radius: 6px; border: 1px solid #3e4452; margin-top: 15px; margin-bottom: 10px; }
        .money-fixed-box label { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: bold; font-size: 14px; }
        .money-fixed-box input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px 10px; border-radius: 4px; width: 150px; outline: none; }

        /* パスワードモーダル */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e24; border: 1px solid #4f545c; border-radius: 8px; padding: 20px; width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { margin: 0; color: #fff; font-size: 16px; border-bottom: 1px solid #4f545c; padding-bottom: 10px; }
        .modal-content label { color: #aaa; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .modal-content input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-modal-save { background: #43b581; } .btn-modal-save:hover { background: #3ca374; }
        .btn-modal-cancel { background: #4f545c; } .btn-modal-cancel:hover { background: #686d73; }

        /* ② 一番左の「成長」チェックを完全に非表示化 */
        .check-col, th.check-col, td.check-col { display: none !important; }
        
        /* ③ テーマカラーの左寄せ固定 */
        #theme-area { justify-content: flex-start !important; }

        /* 能力値・技能値テーブル用のスタイル(崩れないよう補強) */
        .ability-table-wrapper { width: 100%; overflow-x: auto; }
        .ability-table { width: 100%; border-collapse: collapse; text-align: center; color: #dcddde; font-size: 13px; margin-bottom:15px; }
        .ability-table th, .ability-table td { border: 1px solid #3e4452; padding: 8px 4px; }
        .ability-table th { background-color: #252a31; font-weight: bold; }
        .ability-table select, .ability-table input { background-color: #14161a; color: #fff; border: 1px solid #4f545c; border-radius: 4px; padding: 6px 4px; width: 50px; text-align: center; }
        .btn-dice { background: transparent; border: none; cursor: pointer; font-size: 16px; margin-left: 3px; }
        .btn-dice:hover { transform: scale(1.2); }
        .current-val { color: #43b581; font-weight: bold; font-size: 15px; }
        .san-db-row { display: flex; gap: 10px; margin-top: 15px; }
        .san-db-box { display: flex; background-color: #252a31; border: 1px solid #3e4452; border-radius: 4px; flex: 1; }
        .san-db-label { background-color: #1e2227; padding: 10px 15px; font-weight: bold; border-right: 1px solid #3e4452; color: #fff; display: flex; align-items: center;}
        .san-db-value { padding: 10px 15px; display: flex; align-items: center; color: #fff; font-weight: bold; flex: 1; }
        .san-db-value input { background: transparent; border: none; color: #fff; font-weight: bold; font-size: 16px; width: 60px; text-align: center; border-bottom: 1px solid #4f545c; }
        
        .skills-point-header-table { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; background: #252a31; padding: 15px; border-radius: 6px; border: 1px solid #3e4452; }
        .p-header-row { display: flex; justify-content: space-between; align-items: center; }
        .skills-list { display: flex; flex-direction: column; gap: 5px; }
        .skill-row { display: flex; align-items: center; background: #252a31; border: 1px solid #3e4452; border-radius: 4px; padding: 5px 10px; }
        .skill-row .s-col { flex: 1; text-align: center; }
        .skill-row .name-col { flex: 2; text-align: left; font-weight: bold; color: #fff; }
        .skill-row input { background: #14161a; border: 1px solid #4f545c; color: #fff; width: 50px; text-align: center; border-radius: 4px; padding: 4px; }
        .skills-table-header { display: flex; font-weight: bold; color: #b9bbbe; padding: 5px 10px; border-bottom: 1px solid #3e4452; margin-bottom: 5px; }
        .skills-table-header .s-col { flex: 1; text-align: center; }
        .skills-table-header .name-col { flex: 2; text-align: left; }
    </style>
</head>
<body>
    <header class="editor-header">
        <h1 class="editor-title">キャラクター作成・編集</h1>
        <div class="header-actions">
            <!-- ④ ヘッダーからの保存ボタン削除 -->
        </div>
    </header>

    <!-- ⑤ 保存を閲覧・玄関の上に設置 -->
    <div class="fixed-left-menu">
        <button type="button" onclick="saveCharacter()" title="保存する">💾<br><span style="font-size:10px;">保存</span></button>
        <button type="button" onclick="goToView()" title="閲覧画面へ">👁<br><span style="font-size:10px;">閲覧</span></button>
        <button type="button" onclick="goToHome()" title="玄関に戻る">🚪<br><span style="font-size:10px;">玄関</span></button>
    </div>

    <main class="editor-main">
        <form id="char-editor">
            
            <div id="component-info-value"></div>
            
            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('theme-area', this)">
                    <h2 class="section-subtitle">テーマ設定</h2><span class="accordion-icon">⋁</span>
                </div>
                <!-- ③ 左寄せ固定 ＋ ⑨ 画像背景に色を適用するかどうかのチェックボックス追加 -->
                <div id="theme-area" class="accordion-content open" style="display: flex; flex-direction: row; align-items: center; gap: 20px;">
                    <label style="color: #b9bbbe; font-size: 14px; font-weight: bold;">イメージカラー:</label>
                    <input type="color" id="char-color" name="char-color" value="#ffffff" title="キャラクターのテーマカラーを選択">
                    <label style="color: #b9bbbe; font-size: 14px; display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" name="use-bg-color" id="use-bg-color" class="theme-check"> viewの際にイメージカラーを画像の背景に用いる
                    </label>
                </div>
            </div>

            <!-- ★ 能力値テーブルを入れ込みました ★ -->
            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('ability-area', this)">
                    <h2 class="section-subtitle">能力値一覧</h2><span class="accordion-icon">⋁</span>
                </div>
                <div id="ability-area" class="accordion-content open" style="display: block;">
                    <div class="ability-table-wrapper">
                        <table class="ability-table">
                            <thead>
                                <tr>
                                    <th>項目</th>
                                    <th data-popup="3d6 で決定 (2-18)">STR<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('STR')">🎲</button></th>
                                    <th data-popup="3d6 で決定 (2-18)">CON<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('CON')">🎲</button></th>
                                    <th data-popup="3d6 で決定 (2-18)">POW<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('POW')">🎲</button></th>
                                    <th data-popup="3d6 で決定 (2-18)">DEX<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('DEX')">🎲</button></th>
                                    <th data-popup="3d6 で決定 (2-18)">APP<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('APP')">🎲</button></th>
                                    <th data-popup="2d6+6 で決定 (8-18)">SIZ<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('SIZ')">🎲</button></th>
                                    <th data-popup="2d6+6 で決定 (8-18)">INT<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('INT')">🎲</button></th>
                                    <th data-popup="3d6+3 で決定 (3-21)">EDU<button type="button" class="btn-dice" onclick="if(typeof rollIndividual === 'function') rollIndividual('EDU')">🎲</button></th>
                                    <th data-popup="算出方法: (CON + SIZ) / 2 ※端数切り上げ">HP</th>
                                    <th data-popup="算出方法: POW と同じ値">MP</th>
                                    <th data-popup="算出方法: POW × 5">SAN</th>
                                    <th data-popup="算出方法: INT × 5">IDE</th>
                                    <th data-popup="算出方法: POW × 5">幸運</th>
                                    <th data-popup="算出方法: EDU × 5">知識</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="font-weight:bold; color:#fff;">能力値</td>
                                    <td><select name="base-STR" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-CON" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-POW" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-DEX" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-APP" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-SIZ" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-INT" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><select name="base-EDU" class="ability-input" onchange="if(typeof calcAll === 'function') calcAll()"></select></td>
                                    <td><span id="base-HP">-</span></td>
                                    <td><span id="base-MP">-</span></td>
                                    <td><span id="base-SAN">-</span></td>
                                    <td><span id="base-IDE">-</span></td>
                                    <td><span id="base-幸運">-</span></td>
                                    <td><span id="base-知識">-</span></td>
                                </tr>
                                <tr>
                                    <td style="font-weight:bold; color:#b9bbbe;">増加分</td>
                                    <td><input type="number" name="bonus-STR" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-CON" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-POW" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-DEX" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-APP" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-SIZ" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-INT" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-EDU" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-HP" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-MP" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-SAN" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-IDE" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-幸運" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="bonus-知識" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                </tr>
                                <tr>
                                    <td style="font-weight:bold; color:#b9bbbe;">一時的</td>
                                    <td><input type="number" name="temp-STR" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-CON" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-POW" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-DEX" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-APP" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-SIZ" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-INT" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-EDU" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-HP" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-MP" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-SAN" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-IDE" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-幸運" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                    <td><input type="number" name="temp-知識" placeholder="0" oninput="if(typeof calcAll === 'function') calcAll()"></td>
                                </tr>
                                <tr>
                                    <td style="font-weight:bold; color:#fff;">現在値</td>
                                    <td class="current-val" id="cur-STR">0</td>
                                    <td class="current-val" id="cur-CON">0</td>
                                    <td class="current-val" id="cur-POW">0</td>
                                    <td class="current-val" id="cur-DEX">0</td>
                                    <td class="current-val" id="cur-APP">0</td>
                                    <td class="current-val" id="cur-SIZ">0</td>
                                    <td class="current-val" id="cur-INT">0</td>
                                    <td class="current-val" id="cur-EDU">0</td>
                                    <td class="current-val" id="cur-HP">0</td>
                                    <td class="current-val" id="cur-MP">0</td>
                                    <td class="current-val" id="cur-SAN">0</td>
                                    <td class="current-val" id="cur-IDE">0</td>
                                    <td class="current-val" id="cur-幸運">0</td>
                                    <td class="current-val" id="cur-知識">0</td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <div class="san-db-row">
                            <div class="san-db-box" style="flex: 2;">
                                <div class="san-db-label">SAN値</div>
                                <div class="san-db-value">
                                    <input type="number" id="san-input" name="san-input" placeholder="0" min="0" max="99" oninput="if(typeof handleSanInput === 'function') handleSanInput()"> 
                                    <span class="san-max" style="color:#b9bbbe; font-size:14px; margin-left:5px;">/ 99</span>
                                </div>
                            </div>
                            <div class="san-db-box" style="flex: 1;">
                                <div class="san-db-label">不定</div>
                                <div class="san-db-value" id="insanity-display">0</div>
                            </div>
                        </div>
                        
                        <div class="san-db-row" style="margin-top: 10px;">
                            <div class="san-db-box">
                                <div class="san-db-label">ダメージボーナス</div>
                                <div class="san-db-value" id="db-display">なし</div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="button" class="btn-submit" style="margin-top: 15px; padding: 10px 20px; font-size: 14px; background: #007bff;" onclick="if(typeof rollAll === 'function') rollAll()">一斉ランダム</button>
                </div>
            </div>
            
            <div id="component-skills-list"></div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('weapons-area', this)">
                    <h2 class="section-subtitle">戦闘・武器・防具</h2><span class="accordion-icon">⋗</span>
                </div>
                <div id="weapons-area" class="accordion-content" style="display: none;">
                    <div id="weapons-container"></div>
                    <button type="button" class="btn-add-row" onclick="addWeaponRow()">+ 武器・防具を追加</button>
                </div>
            </div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('items-area', this)">
                    <h2 class="section-subtitle">所持品・所持金</h2><span class="accordion-icon">⋗</span>
                </div>
                <div id="items-area" class="accordion-content" style="display: none;">
                    <div class="money-fixed-box">
                        <label>現在の所持金 <input type="text" id="char-money" placeholder="例: 100,000円"></label>
                        <label>借金 <input type="text" id="char-debt" placeholder="例: 0円"></label>
                    </div>
                    <div id="items-container"></div>
                    <button type="button" class="btn-add-row" onclick="addItemRow()">+ 所持品を追加</button>
                </div>
            </div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('scenarios-area', this)">
                    <h2 class="section-subtitle">通過したシナリオ</h2><span class="accordion-icon">⋁</span>
                </div>
                <div id="scenarios-area" class="accordion-content open" style="display: flex;">
                    <div id="scenarios-container"></div>
                    <button type="button" class="btn-add-row" onclick="addScenarioRow()">+ シナリオ歴を追加</button>
                </div>
            </div>

            <div class="custom-section">
                <div class="section-subtitle-bar" onclick="toggleAccordion('memos-area', this)">
                    <h2 class="section-subtitle">詳細メモ（秘匿・バックストーリー等）</h2><span class="accordion-icon">⋁</span>
                </div>
                <div id="memos-area" class="accordion-content open" style="display: flex;">
                    <div id="memos-container"></div>
                    <button type="button" class="btn-add-row" onclick="addMemoRow()">+ 新しいメモを作成</button>
                </div>
            </div>

            <div id="js-tooltip" class="custom-tooltip"></div>
        </form>
    </main>

    <div id="pwd-modal" class="modal">
        <div class="modal-content">
            <h3>パスワード設定</h3>
            <p style="color:#aaa; font-size:12px; margin:0;">このメモを閲覧画面で保護します。</p>
            <label>パスワード (空欄で解除)<input type="text" id="modal-pwd-input" placeholder="パスワードを入力"></label>
            <div class="modal-actions">
                <button type="button" class="btn-modal-cancel" onclick="closePasswordModal()">キャンセル</button>
                <button type="button" class="btn-modal-save" onclick="applyPassword()">保存</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        window.db = db; window.doc = doc; window.setDoc = setDoc;
    </script>

    <!-- 元の美しい外部ファイルをそのまま読み込む階層構造を100%維持 -->
    <script src="basic_information/basic_information.js"></script>
    <script src="skill_value/skill_value.js"></script>
    <script src="ability_value/ability_value.js"></script>

<script>
    // ⑥ 変更検知と未保存時の警告機能
    let isChanged = false;
    function markAsChanged() { isChanged = true; }

    window.addEventListener('beforeunload', function (e) {
        if (isChanged) {
            e.preventDefault();
            e.returnValue = ''; 
        }
    });

    function goToView() {
        if (isChanged) {
            if (!confirm("保存されていません。このまま移動すると変更が破棄されます。本当に移動しますか？")) return;
        }
        const editIndex = localStorage.getItem('editingIndex');
        if (editIndex !== null && editIndex !== "") {
            localStorage.setItem('viewingIndex', editIndex);
            window.location.href = '../view.html';
        } else {
            alert('キャラクターが保存されていません。一度保存ボタンを押してください。');
        }
    }

    function goToHome() {
        if (isChanged) {
            if (!confirm("保存されていません。このまま移動すると変更が破棄されます。本当に移動しますか？")) return;
        }
        window.location.href = '../index.html';
    }

    function toggleAccordion(targetId, headerBar) {
        const content = document.getElementById(targetId);
        const icon = headerBar.querySelector(".accordion-icon");
        if (content.classList.contains("open")) {
            content.classList.remove("open"); content.style.display = "none"; icon.textContent = "⋗";
        } else {
            content.classList.add("open"); content.style.display = "flex"; icon.textContent = "⋁";
        }
    }

    function moveUp(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
        markAsChanged();
    }
    function moveDown(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
        markAsChanged();
    }
    function deleteRow(btn) {
        if(confirm('この項目を削除しますか？')) {
            btn.closest('.dynamic-row').remove();
            markAsChanged();
        }
    }

    function addWeaponRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row weapon-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs weapon-grid-top">
                <label>名称<input type="text" class="w-name" value="${data.name||''}"></label>
                <label>成功率<input type="text" class="w-rate" value="${data.rate||''}"></label>
                <label>ダメージ<input type="text" class="w-dmg" value="${data.damage||''}"></label>
            </div>
            <div class="grid-inputs weapon-grid-bottom" style="margin-top:8px;">
                <label>射程<input type="text" class="w-range" value="${data.range||''}"></label>
                <label>攻撃回数<input type="text" class="w-attacks" value="${data.attacks||''}"></label>
                <label>装弾数<input type="text" class="w-ammo" value="${data.ammo||''}"></label>
                <label>耐久力<input type="text" class="w-hp" value="${data.hp||''}"></label>
                <label>故障<input type="text" class="w-malf" value="${data.malf||''}"></label>
                <label>その他<input type="text" class="w-other" value="${data.other||''}"></label>
            </div>
        `;
        document.getElementById('weapons-container').appendChild(div);
        markAsChanged();
    }

    function addItemRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row item-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs item-grid-top">
                <label>名称<input type="text" class="i-name" value="${data.name||''}"></label>
                <label>単価<input type="text" class="i-unit" value="${data.unitPrice||''}"></label>
                <label>個数<input type="text" class="i-qty" value="${data.quantity||''}"></label>
            </div>
            <div class="grid-inputs item-grid-bottom" style="margin-top:8px;">
                <label>価格 (自動/手動)<input type="text" class="i-total" value="${data.totalPrice||''}"></label>
                <label>効果・備考など<input type="text" class="i-notes" value="${data.notes||''}"></label>
            </div>
        `;
        document.getElementById('items-container').appendChild(div);
        markAsChanged();
    }

    function addScenarioRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row scenario-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs scenario-grid">
                <label>完了日<input type="date" class="s-date" value="${data.date||''}"></label>
                <label>シナリオ名<input type="text" class="s-name" value="${data.name||''}"></label>
            </div>
            <div class="grid-inputs" style="margin-top: 8px;">
                <label>メモ（成長した技能やSAN値の減少など）<textarea class="s-memo" style="height: 60px; resize: vertical;" placeholder="減少したSAN値や手に入れたアーティファクト、成長技能などをメモ">${data.memo||''}</textarea></label>
            </div>
        `;
        document.getElementById('scenarios-container').appendChild(div);
        markAsChanged();
    }

    let activePwdInput = null;
    function openPasswordModal(btn) {
        activePwdInput = btn.closest('.memo-row').querySelector('.m-pwd');
        document.getElementById('modal-pwd-input').value = activePwdInput.value;
        document.getElementById('pwd-modal').style.display = 'flex';
    }
    function closePasswordModal() { document.getElementById('pwd-modal').style.display = 'none'; activePwdInput = null; }
    function applyPassword() {
        if(activePwdInput) activePwdInput.value = document.getElementById('modal-pwd-input').value;
        closePasswordModal();
        activePwdInput.parentElement.querySelector('button').innerText = activePwdInput.value ? '🔒 保護中' : '🔑 パスワード設定';
        markAsChanged();
    }

    function addMemoRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row memo-row';
        const hasPwd = data.password && data.password !== '';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs memo-grid-top">
                <label style="color:#bb86fc; font-weight:bold;">メモタイトル<input type="text" class="m-title" value="${data.title||''}" style="font-size:16px; border-color:#6366f1;"></label>
                <button type="button" onclick="openPasswordModal(this)" style="height:36px; padding:0 15px; background:#4f545c; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                    ${hasPwd ? '🔒 保護中' : '🔑 パスワード設定'}
                </button>
            </div>
            <textarea class="m-content" style="width:100%; height:150px; margin-top:10px; resize:vertical;" placeholder="詳細な情報を入力...">${data.content||''}</textarea>
            <input type="hidden" class="m-pwd" value="${data.password||''}">
        `;
        document.getElementById('memos-container').appendChild(div);
        markAsChanged();
    }

    document.addEventListener("DOMContentLoaded", () => {
        // 外部ファイルのDOM生成を待つ
        setTimeout(() => {
            const editIndex = localStorage.getItem('editingIndex');
            if (editIndex !== null && editIndex !== "") {
                const chars = JSON.parse(localStorage.getItem('characters') || '[]');
                const char = chars[parseInt(editIndex, 10)];
                if (char) {
                    window.charMainImages = char.mainImages || []; window.charExprImages = char.exprImages || [];
                    if(typeof updateMainPreview === 'function') updateMainPreview();

                    document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
                        let key = el.name || el.id;
                        if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
                        if (key && char[key] !== undefined) {
                            if (el.type === 'checkbox') el.checked = char[key]; else el.value = char[key];
                        }
                    });
                    if(char.money) document.getElementById('char-money').value = char.money;
                    if(char.debt) document.getElementById('char-debt').value = char.debt;

                    if (typeof window.calcAll === 'function') window.calcAll();
                    if (typeof window.calcSkills === 'function') window.calcSkills();
                    
                    // ⑩ SAN値から不定の狂気（4/5）を算出・反映させる
                    const sanInput = document.getElementById('san-input');
                    if (sanInput && typeof window.calcInsanityOnly === 'function') {
                        window.calcInsanityOnly();
                    }
                }
            }
            
            if(document.getElementById('weapons-container').children.length === 0) addWeaponRow();
            if(document.getElementById('items-container').children.length === 0) addItemRow();
            if(document.getElementById('scenarios-container').children.length === 0) addScenarioRow();
            if(document.getElementById('memos-container').children.length === 0) addMemoRow({title: "基本設定メモ"});

            // 自動入力で「変更あり」にならないように遅延して監視開始
            setTimeout(() => {
                isChanged = false;
                document.getElementById('char-editor').addEventListener('input', markAsChanged);
                document.getElementById('char-editor').addEventListener('change', markAsChanged);
            }, 100);
        }, 500); // 外部ファイルの描画完了を待つ時間
    });

    async function saveCharacter() {
        const chars = JSON.parse(localStorage.getItem('characters') || '[]');
        const editIndex = localStorage.getItem('editingIndex');
        const newData = {};

        document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
            let key = el.name || el.id;
            if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
            if (key) newData[key] = el.type === 'checkbox' ? el.checked : el.value;
        });

        newData.mainImages = window.charMainImages || [];
        newData.exprImages = window.charExprImages || [];
        newData.name = document.getElementById("char-name-new")?.value || "無名の探索者";
        newData.money = document.getElementById("char-money").value;
        newData.debt = document.getElementById("char-debt").value;

        newData.weapons = Array.from(document.querySelectorAll('.weapon-row')).map(row => ({
            name: row.querySelector('.w-name').value, rate: row.querySelector('.w-rate').value, damage: row.querySelector('.w-dmg').value,
            range: row.querySelector('.w-range').value, attacks: row.querySelector('.w-attacks').value, ammo: row.querySelector('.w-ammo').value,
            hp: row.querySelector('.w-hp').value, malf: row.querySelector('.w-malf').value, other: row.querySelector('.w-other').value
        })).filter(w => w.name.trim() !== "");

        newData.items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
            name: row.querySelector('.i-name').value, unitPrice: row.querySelector('.i-unit').value, quantity: row.querySelector('.i-qty').value,
            totalPrice: row.querySelector('.i-total').value, notes: row.querySelector('.i-notes').value
        })).filter(i => i.name.trim() !== "");

        newData.scenarios = Array.from(document.querySelectorAll('.scenario-row')).map(row => ({
            date: row.querySelector('.s-date').value, 
            name: row.querySelector('.s-name').value,
            memo: row.querySelector('.s-memo').value
        })).filter(s => s.name.trim() !== "");

        newData.memos = Array.from(document.querySelectorAll('.memo-row')).map(row => ({
            title: row.querySelector('.m-title').value, content: row.querySelector('.m-content').value, password: row.querySelector('.m-pwd').value
        })).filter(m => m.title.trim() !== "" || m.content.trim() !== "");

        if (editIndex !== null && editIndex !== "") {
            newData.uid = chars[parseInt(editIndex, 10)].uid;
            chars[parseInt(editIndex, 10)] = newData;
        } else {
            newData.uid = 'char_' + Date.now().toString(16) + Math.random().toString(16).slice(2);
            chars.push(newData);
            // 新規作成時、保存したデータのindexをセットして閲覧画面等に飛べるようにする
            localStorage.setItem('editingIndex', chars.length - 1);
        }

        try {
            if (window.setDoc && window.doc && window.db) {
                await window.setDoc(window.doc(window.db, "characters", newData.uid), newData);
            }
            localStorage.setItem('characters', JSON.stringify(chars));
            
            isChanged = false; // 保存完了
            alert("保存しました！引き続き編集可能です。");
        } catch (e) {
            console.error("保存エラー:", e);
            alert("保存に失敗しました。容量制限または通信エラーの可能性があります。");
        }
    }
</script>

<!-- ①,⑩ 不定の狂気計算を「4/5」に上書きし、SAN値の入力に連動させる処理 -->
<script>
    window.addEventListener('load', function() {
        // 外部ファイル内の関数をオーバーライドして修正
        setTimeout(() => {
            if(typeof window.calcInsanityOnly === 'function') {
                window.calcInsanityOnly = function() {
                    const sanInput = document.getElementById('san-input');
                    if (!sanInput) return;
                    
                    const mythosValue = parseInt(document.getElementById('total-mythos')?.textContent, 10) || 0;
                    const maxSan = 99 - mythosValue;
                    
                    const maxSanEl = document.querySelector('.san-max');
                    if (maxSanEl) maxSanEl.textContent = `/ ${maxSan}`;

                    let currentSan = parseInt(sanInput.value, 10) || 0;
                    
                    if (currentSan > maxSan) { currentSan = maxSan; sanInput.value = maxSan; }
                    if (currentSan < 0) { currentSan = 0; sanInput.value = 0; }
                    
                    // ① 不定の狂気 ＝ 現在のSAN値の 4/5 (80%) を切り捨て
                    const insanityVal = Math.floor(currentSan * 4 / 5);
                    const insanityDisplay = document.getElementById('insanity-display');
                    if(insanityDisplay) insanityDisplay.textContent = insanityVal;
                };

                // ⑩ SAN値入力欄のイベントに上書き登録し、毎回算出させる
                const sanInputEl = document.getElementById('san-input');
                if(sanInputEl) {
                    sanInputEl.addEventListener('input', () => {
                        window.hasManuallySetSan = true;
                        window.calcInsanityOnly();
                    });
                }
            }
        }, 1000);
    });
</script>
</body>
</html>
