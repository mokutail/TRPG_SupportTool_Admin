<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="basic_information/basic_information.css">
    <link rel="stylesheet" href="ability_value/ability_value.css">
    <link rel="stylesheet" href="skill_value/skill_value.css">
    <title>キャラクター作成 - CoC 6th</title>
    <style>
        body { margin: 0; padding-bottom: 50px; background-color: #36393f; color: #dcddde; font-family: 'Segoe UI', sans-serif; }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #36393f;
            padding: 15px 40px;
            border-bottom: 1px solid #202225;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .editor-title { margin: 0; color: #fff; font-size: 24px; }
        
        .btn-submit {
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            border: none;
            color: white;
            background: #43b581;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #3ca374; }

        .fixed-left-menu {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        .fixed-left-menu button {
            background: #2f3136;
            color: #fff;
            border: 1px solid #4f545c;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: 0.2s;
            line-height: 1.2;
        }
        .fixed-left-menu button:hover {
            background: #4f545c;
            border-color: #bb86fc;
            color: #bb86fc;
            transform: scale(1.1);
        }
        .editor-main { padding: 20px 40px 20px 90px; }

        .info-content-wrapper[style*="display: none"],
        .accordion-content[style*="display: none"] {
            display: none !important;
        }

        .custom-section { 
            max-width: 1300px; width: 100%; background-color: #1e2227; 
            border: 1px solid #323842; border-radius: 6px; padding: 20px; 
            margin-bottom: 25px; display: flex; flex-direction: column; box-sizing: border-box; 
        }

        .dynamic-row { background: #252a31; border: 1px solid #3e4452; border-radius: 6px; padding: 15px; margin-bottom: 10px; position: relative; }
        .row-controls { display: flex; gap: 5px; margin-bottom: 10px; justify-content: flex-end; }
        .row-controls button { background: #3e4452; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .row-controls button:hover { background: #5c6370; }
        .row-controls button.btn-del { background: #f04747; }
        .row-controls button.btn-del:hover { background: #d84040; }

        .grid-inputs { display: grid; gap: 10px; }
        .grid-inputs label { font-size: 13px; color: #aaa; display: flex; flex-direction: column; gap: 4px; }
        .grid-inputs input, .grid-inputs textarea { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; outline: none; }
        .grid-inputs input[type="date"] { cursor: pointer; color: #fff; }
        .grid-inputs input:focus, .grid-inputs textarea:focus { border-color: #bb86fc; }

        input[type="color"] { cursor: pointer; border: none; background: transparent; width: 60px; height: 35px; padding: 0; border-radius: 4px; }

        .weapon-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .weapon-grid-bottom { grid-template-columns: repeat(6, 1fr); }
        .item-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .item-grid-bottom { grid-template-columns: 1fr 3fr; }
        .scenario-grid { grid-template-columns: 1fr 2fr; }

        .btn-add-row { background: transparent; border: 1px solid #4c566a; color: #d8dee9; padding: 10px; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; margin-top: 5px; transition: 0.2s;}
        .btn-add-row:hover { background: #3b4252; color: #fff; }
        .memo-grid-top { grid-template-columns: 1fr auto; align-items: end; }
        .money-fixed-box { display: flex; gap: 20px; background: #252a31; padding: 15px; border-radius: 6px; border: 1px solid #3e4452; margin-top: 15px; margin-bottom: 10px; }
        .money-fixed-box label { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: bold; font-size: 14px; }
        .money-fixed-box input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px 10px; border-radius: 4px; width: 150px; outline: none; }

        /* モーダル */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e24; border: 1px solid #4f545c; border-radius: 8px; padding: 20px; width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { margin: 0; color: #fff; font-size: 16px; border-bottom: 1px solid #4f545c; padding-bottom: 10px; }
        .modal-content label { color: #aaa; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .modal-content input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-modal-save { background: #43b581; } .btn-modal-save:hover { background: #3ca374; }
        .btn-modal-cancel { background: #4f545c; } .btn-modal-cancel:hover { background: #686d73; }

        /* ★復活：能力値一覧テーブルの完全なスタイル */
        .ability-table-wrapper {
            background-color: #1e2227;
            border: 1px solid #323842;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            max-width: 1300px;
            width: 100%;
            box-sizing: border-box;
        }
        .ability-table-wrapper h2 {
            margin-top: 0;
            color: #fff;
            font-size: 18px;
            border-left: 4px solid #bb86fc;
            padding-left: 10px;
            margin-bottom: 15px;
        }
        .ability-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            color: #dcddde;
            font-size: 13px;
        }
        .ability-table th, .ability-table td {
            border: 1px solid #3e4452;
            padding: 8px 4px;
            vertical-align: middle;
        }
        .ability-table th {
            background-color: #252a31;
            font-weight: bold;
        }
        .ability-table .dice-icon {
            font-size: 18px;
            cursor: pointer;
            display: block;
            margin-top: 4px;
            transition: transform 0.2s;
        }
        .ability-table .dice-icon:hover {
            transform: scale(1.3);
        }
        .ability-table select, .ability-table input {
            background-color: #14161a;
            color: #fff;
            border: 1px solid #4f545c;
            border-radius: 4px;
            padding: 6px 4px;
            width: 50px;
            text-align: center;
            outline: none;
        }
        .ability-table select:focus, .ability-table input:focus {
            border-color: #bb86fc;
        }
        .ability-table .current-val {
            color: #43b581;
            font-weight: bold;
            font-size: 15px;
        }
        .derived-label { background-color: #212529 !important; }
        .derived-val { color: #b9bbbe; }
        .san-db-row { display: flex; gap: 10px; margin-top: 15px; }
        .san-db-box { display: flex; background-color: #252a31; border: 1px solid #3e4452; border-radius: 4px; overflow: hidden; flex: 1; }
        .san-db-label { background-color: #1e2227; padding: 10px 15px; font-weight: bold; border-right: 1px solid #3e4452; width: 130px; display: flex; align-items: center; color: #fff; }
        .san-db-value { padding: 10px 15px; display: flex; align-items: center; flex: 1; font-weight: bold; color: #fff; }
        .san-db-value input { background: transparent; border: none; color: #fff; font-weight: bold; font-size: 16px; width: 60px; text-align: center; margin-right: 5px; border-bottom: 1px solid #4f545c; }
        .san-db-value input:focus { outline: none; border-bottom-color: #bb86fc; }
        .btn-random-all { background-color: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 14px; transition: 0.2s; }
        .btn-random-all:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header class="editor-header">
        <h1 class="editor-title">キャラクター作成・編集</h1>
        <div class="header-actions">
            <button type="button" class="btn-submit" onclick="saveCharacter()">💾 保存する</button>

    </header>

    <div class="fixed-left-menu">

        <button type="button" onclick="window.location.href='../index.html'" title="玄関に戻る">🚪<br><span style="font-size:10px;">玄関</span></button>

                </div>
            </div>

                    <thead>

                            <th>POW<span class="dice-icon" onclick="rollIndividual('POW')">🎲</span></th>
                            <th>DEX<span class="dice-icon" onclick="rollIndividual('DEX')">🎲</span></th>
                            <th>APP<span class="dice-icon" onclick="rollIndividual('APP')">🎲</span></th>
                            <th>SIZ<span class="dice-icon" onclick="rollIndividual('SIZ')">🎲</span></th>
                            <th>INT<span class="dice-icon" onclick="rollIndividual('INT')">🎲</span></th>
                            <th>EDU<span class="dice-icon" onclick="rollIndividual('EDU')">🎲</span></th>
                            <th class="derived-label">HP</th>
                            <th class="derived-label">MP</th>
                            <th class="derived-label">SAN</th>

                            <td><select name="base-CON" class="ability-input" onchange="calcAll()"></select></td>
                            <td><select name="base-POW" class="ability-input" onchange="calcAll()"></select></td>
                            <td><select name="base-DEX" class="ability-input" onchange="calcAll()"></select></td>
                            <td><select name="base-APP" class="ability-input" onchange="calcAll()"></select></td>
                            <td><select name="base-SIZ" class="ability-input" onchange="calcAll()"></select></td>
                            <td><select name="base-INT" class="ability-input" onchange="calcAll()"></select></td>
                            <td><select name="base-EDU" class="ability-input" onchange="calcAll()"></select></td>
                            <td class="derived-val" id="base-HP">0</td>
                            <td class="derived-val" id="base-MP">0</td>

                            <td><input type="number" name="bonus-POW" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-DEX" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-APP" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-SIZ" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-INT" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-EDU" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-HP" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-MP" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-SAN" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-IDE" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-幸運" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="bonus-知識" oninput="calcAll()" value="0"></td>

                            <td><input type="number" name="temp-APP" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-SIZ" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-INT" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-EDU" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-HP" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-MP" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-SAN" oninput="calcAll()" value="0"></td>
                            <td><input type="number" name="temp-IDE" oninput="calcAll()" value="0"></td>

        window.db = db; window.doc = doc; window.setDoc = setDoc;

<script>
    let isChanged = false;
    function markAsChanged() { isChanged = true; }

    window.addEventListener('beforeunload', function (e) {
        if (isChanged) {
            e.preventDefault();
            e.returnValue = ''; 
        }
    });

    function toggleAccordion(targetId, headerBar) {
        const content = document.getElementById(targetId);
        const icon = headerBar.querySelector(".accordion-icon");
        if (content.classList.contains("open")) {
            content.classList.remove("open"); content.style.display = "none"; icon.textContent = "⋗";
        } else {
            content.classList.add("open"); content.style.display = "flex"; icon.textContent = "⋁";
        }
    }

    function goToView() {
        if (isChanged) {
            if (!confirm("保存されていません。このまま移動すると変更が破棄されます。本当に移動しますか？")) return;
        }
        const editIndex = localStorage.getItem('editingIndex');
        if (editIndex !== null && editIndex !== "") {
            localStorage.setItem('viewingIndex', editIndex);
            window.location.href = '../view.html';
        } else {
            alert('キャラクターが保存されていません。一度保存ボタンを押してください。');
        }
    }

    function goToHome() {
        if (isChanged) {
            if (!confirm("保存されていません。このまま移動すると変更が破棄されます。本当に移動しますか？")) return;
        }
        window.location.href = '../index.html';
    }

    function moveUp(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
        markAsChanged();
    }
    function moveDown(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
        markAsChanged();
    }
    function deleteRow(btn) {
        if(confirm('この項目を削除しますか？')) {
            btn.closest('.dynamic-row').remove();
            markAsChanged();
        }
    }

    function addWeaponRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row weapon-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs weapon-grid-top">
                <label>名称<input type="text" class="w-name" value="${data.name||''}"></label>
                <label>成功率<input type="text" class="w-rate" value="${data.rate||''}"></label>
                <label>ダメージ<input type="text" class="w-dmg" value="${data.damage||''}"></label>
            </div>
            <div class="grid-inputs weapon-grid-bottom" style="margin-top:8px;">
                <label>射程<input type="text" class="w-range" value="${data.range||''}"></label>
                <label>攻撃回数<input type="text" class="w-attacks" value="${data.attacks||''}"></label>
                <label>装弾数<input type="text" class="w-ammo" value="${data.ammo||''}"></label>
                <label>耐久力<input type="text" class="w-hp" value="${data.hp||''}"></label>
                <label>故障<input type="text" class="w-malf" value="${data.malf||''}"></label>
                <label>その他<input type="text" class="w-other" value="${data.other||''}"></label>
            </div>
        `;
        document.getElementById('weapons-container').appendChild(div);
        markAsChanged();
    }

    function addItemRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row item-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs item-grid-top">
                <label>名称<input type="text" class="i-name" value="${data.name||''}"></label>
                <label>単価<input type="text" class="i-unit" value="${data.unitPrice||''}"></label>
                <label>個数<input type="text" class="i-qty" value="${data.quantity||''}"></label>
            </div>
            <div class="grid-inputs item-grid-bottom" style="margin-top:8px;">
                <label>価格 (自動/手動)<input type="text" class="i-total" value="${data.totalPrice||''}"></label>
                <label>効果・備考など<input type="text" class="i-notes" value="${data.notes||''}"></label>
            </div>
        `;
        document.getElementById('items-container').appendChild(div);
        markAsChanged();
    }

    function addScenarioRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row scenario-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs scenario-grid">
                <label>完了日<input type="date" class="s-date" value="${data.date||''}"></label>
                <label>シナリオ名<input type="text" class="s-name" value="${data.name||''}"></label>
            </div>
            <div class="grid-inputs" style="margin-top: 8px;">
                <label>メモ（成長した技能やSAN値の減少など）<textarea class="s-memo" style="height: 60px; resize: vertical;" placeholder="減少したSAN値や手に入れたアーティファクト、成長技能などをメモ">${data.memo||''}</textarea></label>
            </div>
        `;
        document.getElementById('scenarios-container').appendChild(div);
        markAsChanged();
    }

    let activePwdInput = null;
    function openPasswordModal(btn) {
        activePwdInput = btn.closest('.memo-row').querySelector('.m-pwd');
        document.getElementById('modal-pwd-input').value = activePwdInput.value;
        document.getElementById('pwd-modal').style.display = 'flex';
    }
    function closePasswordModal() { document.getElementById('pwd-modal').style.display = 'none'; activePwdInput = null; }
    function applyPassword() {
        if(activePwdInput) activePwdInput.value = document.getElementById('modal-pwd-input').value;
        closePasswordModal();
        activePwdInput.parentElement.querySelector('button').innerText = activePwdInput.value ? '🔒 保護中' : '🔑 パスワード設定';
        markAsChanged();
    }

    function addMemoRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row memo-row';
        const hasPwd = data.password && data.password !== '';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs memo-grid-top">
                <label style="color:#bb86fc; font-weight:bold;">メモタイトル<input type="text" class="m-title" value="${data.title||''}" style="font-size:16px; border-color:#6366f1;"></label>
                <button type="button" onclick="openPasswordModal(this)" style="height:36px; padding:0 15px; background:#4f545c; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                    ${hasPwd ? '🔒 保護中' : '🔑 パスワード設定'}
                </button>
            </div>
            <textarea class="m-content" style="width:100%; height:150px; margin-top:10px; resize:vertical;" placeholder="詳細な情報を入力...">${data.content||''}</textarea>
            <input type="hidden" class="m-pwd" value="${data.password||''}">
        `;
        document.getElementById('memos-container').appendChild(div);
        markAsChanged();
    }

    function diceRoll(num, size, add = 0) {
        let total = add;
        for (let i = 0; i < num; i++) total += Math.floor(Math.random() * size) + 1;
        return total;
    }

    window.rollIndividual = function(stat) {
        const select = document.querySelector(`select[name="base-${stat}"]`);
        if (!select) return;
        let result = 0;
        if (['STR', 'CON', 'POW', 'DEX', 'APP'].includes(stat)) result = diceRoll(3, 6);
        else if (['SIZ', 'INT'].includes(stat)) result = diceRoll(2, 6, 6);
        else if (stat === 'EDU') result = diceRoll(3, 6, 3);
        select.value = result;

        if (stat === 'POW') window.hasManuallySetSan = false;
        
        if (typeof window.calcAll === 'function') window.calcAll();
        markAsChanged();
    };

    window.rollAll = function() {
        window.hasManuallySetSan = false;
        ['STR', 'CON', 'POW', 'DEX', 'APP', 'SIZ', 'INT', 'EDU'].forEach(stat => rollIndividual(stat));
    };

    window.hasManuallySetSan = false;
    window.handleSanInput = function() {
        window.hasManuallySetSan = true;
        if(typeof window.calcInsanityOnly === 'function') window.calcInsanityOnly();
    };

    document.addEventListener("DOMContentLoaded", () => {
        // セレクトボックスの初期化
        const selectElements = document.querySelectorAll(".ability-input");
        selectElements.forEach(select => {
            if(select.tagName === "SELECT") {
                select.innerHTML = "<option value=''></option>";
                let min = 2, max = 18;
                if (select.name === "base-EDU") { min = 3; max = 21; }
                for (let i = min; i <= max; i++) {
                    const opt = document.createElement("option");
                    opt.value = i; opt.textContent = i; select.appendChild(opt);
                }
            }
        });

        const editIndex = localStorage.getItem('editingIndex');
        if (editIndex !== null && editIndex !== "") {
            const chars = JSON.parse(localStorage.getItem('characters') || '[]');
            const char = chars[parseInt(editIndex, 10)];
            if (char) {
                window.charMainImages = char.mainImages || []; window.charExprImages = char.exprImages || [];
                if(typeof updateMainPreview === 'function') updateMainPreview();

                // カスタム技能の復元
                const standardSkills = ["回避","キック","組み付き","こぶし","頭突き","投擲","マーシャルアーツ","拳銃","サブマシンガン","ショットガン","マシンガン","ライフル","応急手当","鍵開け","隠す","隠れる","聞き耳","忍び歩き","写真術","精神分析","追跡","登攀","図書館","目星","運転","機械修理","重機械操作","乗馬","水泳","製作","操縦","跳躍","電気修理","ナビゲート","変装","言いくるめ","信用","説得","値切り","母国語","医学","オカルト","化学","芸術","経理","考古学","コンピューター","心理学","人類学","生物学","地質学","電子工学","天文学","博物学","物理学","法律","薬学","歴史","神話"];
                Object.keys(char).forEach(key => {
                    if(key.match(/^sk-(job|int|gro|oth)-/)) {
                        const skillName = key.replace(/^sk-(job|int|gro|oth)-/, '');
                        if (!standardSkills.includes(skillName) && !document.querySelector(`input[name="sk-job-${skillName}"]`)) {
                            const list = document.querySelector('#knowledge-skills-area .skills-list');
                            if(list) {
                                const uniqueId = Date.now() + Math.random().toString().slice(2, 6);
                                const initVal = char['sk-init-' + skillName] || 1;
                                const row = document.createElement('div');
                                row.className = 'skill-row custom-added-skill';
                                row.setAttribute('data-initial', initVal);
                                row.innerHTML = `
                                    <div class="s-col name-col font-input-wrapper" style="display:flex; align-items:center;">
                                        <input type="text" class="skill-name-inline custom-name-input" value="${skillName}" oninput="updateCustomSkillName(this, '${uniqueId}')" style="width:100px;">
                                        <button type="button" style="background:#f04747; color:#fff; border:none; padding:2px 8px; border-radius:4px; margin-left:5px; cursor:pointer;" onclick="this.parentElement.parentElement.remove(); calcSkills(); if(typeof markAsChanged === 'function') markAsChanged();">✖</button>
                                    </div>
                                    <div class="s-col val-col">
                                        <input type="number" class="custom-init-input" name="sk-init-${skillName}" value="${initVal}" min="0" max="99" oninput="updateCustomSkillInit(this); calcSkills();" style="width:40px; background:transparent; border:1px solid #4f545c; color:#bb86fc; text-align:center; border-radius:4px; font-weight:bold;">
                                    </div>
                                    <div class="s-col input-col"><input type="number" name="sk-job-${skillName}" oninput="calcSkills()"></div>
                                    <div class="s-col input-col"><input type="number" name="sk-int-${skillName}" oninput="calcSkills()"></div>
                                    <div class="s-col input-col"><input type="number" name="sk-gro-${skillName}" oninput="calcSkills()"></div>
                                    <div class="s-col input-col"><input type="number" name="sk-oth-${skillName}" oninput="calcSkills()"></div>
                                    <div class="s-col total-col"><span class="skill-total">1</span></div>
                                `;
                                const mythosRow = list.querySelector('.skill-mythos-row');
                                if(mythosRow) list.insertBefore(row, mythosRow);
                                else list.appendChild(row);
                            }
                        }
                    }
                });

                setTimeout(() => {
                    document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
                        let key = el.name || el.id;
                        if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
                        if (key && char[key] !== undefined) {
                            if (el.type === 'checkbox') el.checked = char[key]; else el.value = char[key];
                        }
                    });
                    if(char.money) document.getElementById('char-money').value = char.money;
                    if(char.debt) document.getElementById('char-debt').value = char.debt;

                    if (typeof window.calcAll === 'function') window.calcAll();
                    if (typeof window.calcSkills === 'function') window.calcSkills();
                }, 100);

                if(char.weapons) char.weapons.forEach(w => addWeaponRow(w));
                if(char.items) char.items.forEach(i => addItemRow(i));
                if(char.scenarios) char.scenarios.forEach(s => addScenarioRow(s));
                if(char.memos) char.memos.forEach(m => addMemoRow(m));
            }
        }
        
        if(document.getElementById('weapons-container').children.length === 0) addWeaponRow();
        if(document.getElementById('items-container').children.length === 0) addItemRow();
        if(document.getElementById('scenarios-container').children.length === 0) addScenarioRow();
        if(document.getElementById('memos-container').children.length === 0) addMemoRow({title: "基本設定メモ"});

        setTimeout(() => {
            document.getElementById('char-editor').addEventListener('input', markAsChanged);
            document.getElementById('char-editor').addEventListener('change', markAsChanged);
        }, 1000);
    });

    async function saveCharacter() {
        const chars = JSON.parse(localStorage.getItem('characters') || '[]');
        const editIndex = localStorage.getItem('editingIndex');
        const newData = {};

        document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
            let key = el.name || el.id;
            if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
            if (key) newData[key] = el.type === 'checkbox' ? el.checked : el.value;
        });

        newData.mainImages = window.charMainImages || [];
        newData.exprImages = window.charExprImages || [];
        newData.name = document.getElementById("char-name-new")?.value || "無名の探索者";
        newData.money = document.getElementById("char-money").value;
        newData.debt = document.getElementById("char-debt").value;

        newData.weapons = Array.from(document.querySelectorAll('.weapon-row')).map(row => ({
            name: row.querySelector('.w-name').value, rate: row.querySelector('.w-rate').value, damage: row.querySelector('.w-dmg').value,
            range: row.querySelector('.w-range').value, attacks: row.querySelector('.w-attacks').value, ammo: row.querySelector('.w-ammo').value,
            hp: row.querySelector('.w-hp').value, malf: row.querySelector('.w-malf').value, other: row.querySelector('.w-other').value
        })).filter(w => w.name.trim() !== "");

        newData.items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
            name: row.querySelector('.i-name').value, unitPrice: row.querySelector('.i-unit').value, quantity: row.querySelector('.i-qty').value,
            totalPrice: row.querySelector('.i-total').value, notes: row.querySelector('.i-notes').value
        })).filter(i => i.name.trim() !== "");

        newData.scenarios = Array.from(document.querySelectorAll('.scenario-row')).map(row => ({
            date: row.querySelector('.s-date').value, 
            name: row.querySelector('.s-name').value,
            memo: row.querySelector('.s-memo').value
        })).filter(s => s.name.trim() !== "");

        newData.memos = Array.from(document.querySelectorAll('.memo-row')).map(row => ({
            title: row.querySelector('.m-title').value, content: row.querySelector('.m-content').value, password: row.querySelector('.m-pwd').value
        })).filter(m => m.title.trim() !== "" || m.content.trim() !== "");

        if (editIndex !== null && editIndex !== "") {
            newData.uid = chars[parseInt(editIndex, 10)].uid;
            chars[parseInt(editIndex, 10)] = newData;
        } else {
            newData.uid = 'char_' + Date.now().toString(16) + Math.random().toString(16).slice(2);
            chars.push(newData);
            localStorage.setItem('editingIndex', chars.length - 1);
        }

        try {
            if (window.setDoc && window.doc && window.db) {
                await window.setDoc(window.doc(window.db, "characters", newData.uid), newData);
            }
            localStorage.setItem('characters', JSON.stringify(chars));
            
            isChanged = false; // 保存完了
            alert("保存しました！引き続き編集可能です。");
        } catch (e) {
            console.error("保存エラー:", e);
            alert("保存に失敗しました。容量制限または通信エラーの可能性があります。");
        }
    }
</script>
</body>
</html>
