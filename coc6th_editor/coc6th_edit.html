<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="basic_information/basic_information.css">
    <link rel="stylesheet" href="ability_value/ability_value.css">
    <link rel="stylesheet" href="skill_value/skill_value.css">
    <title>キャラクター作成 - CoC 6th</title>
    <style>
        /* --- 追加UI（アコーディオン・グリッド等）の専用スタイル --- */
        .details-section { margin-top: 30px; max-width: 1300px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .acc-group { background: #212529; border: 1px solid #2d323f; border-radius: 6px; overflow: hidden; }
        .acc-header { background: #2d323b; padding: 12px 20px; font-weight: bold; color: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .acc-header:hover { background: #363b45; }
        .acc-content { padding: 15px; display: none; flex-direction: column; gap: 10px; background: #1e2227; }
        .acc-group.open .acc-content { display: flex; }
        .acc-group.open .acc-icon { transform: rotate(180deg); }

        .dynamic-row { background: #252a31; border: 1px solid #3e4452; border-radius: 6px; padding: 10px; position: relative; }
        .row-controls { display: flex; gap: 5px; margin-bottom: 8px; justify-content: flex-end; }
        .row-controls button { background: #3e4452; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .row-controls button:hover { background: #5c6370; }
        .row-controls button.btn-del { background: #f04747; }
        .row-controls button.btn-del:hover { background: #d84040; }

        .grid-inputs { display: grid; gap: 8px; }
        .grid-inputs label { font-size: 12px; color: #aaa; display: flex; flex-direction: column; gap: 4px; }
        .grid-inputs input, .grid-inputs textarea { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 14px; outline: none; }
        .grid-inputs input:focus, .grid-inputs textarea:focus { border-color: #bb86fc; }

        /* 武器グリッド (画像1枚目再現) */
        .weapon-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .weapon-grid-bottom { grid-template-columns: repeat(6, 1fr); }
        
        /* 所持品グリッド (画像2枚目再現) */
        .item-grid-top { grid-template-columns: 2fr 1fr 1fr; }
        .item-grid-bottom { grid-template-columns: 1fr 3fr; }

        /* シナリオグリッド */
        .scenario-grid { grid-template-columns: 1fr 3fr; }

        .btn-add-row { background: transparent; border: 1px solid #4c566a; color: #d8dee9; padding: 8px; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; margin-top: 5px; }
        .btn-add-row:hover { background: #3b4252; }

        /* メモ専用スタイル */
        .memo-grid-top { grid-template-columns: 1fr auto; align-items: end; }
        
        /* 所持金固定枠 */
        .money-fixed-box { display: flex; gap: 20px; background: #252a31; padding: 15px; border-radius: 6px; border: 1px solid #3e4452; margin-top: 10px; }
        .money-fixed-box label { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: bold; font-size: 14px; }
        .money-fixed-box input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 6px 10px; border-radius: 4px; width: 150px; outline: none; }

        /* パスワードモーダル */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e24; border: 1px solid #4f545c; border-radius: 8px; padding: 20px; width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h3 { margin: 0; color: #fff; font-size: 16px; border-bottom: 1px solid #4f545c; padding-bottom: 10px; }
        .modal-content label { color: #aaa; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .modal-content input { background: #14161a; border: 1px solid #3e4452; color: #fff; padding: 8px; border-radius: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-modal-save { background: #43b581; } .btn-modal-save:hover { background: #3ca374; }
        .btn-modal-cancel { background: #4f545c; } .btn-modal-cancel:hover { background: #686d73; }
    </style>
</head>
<body>
    <header class="editor-header">
        <a href="../index.html" class="back-link">← 玄関に戻る</a>
        <h1 class="editor-title">キャラクター作成</h1>
    </header>

    <main class="editor-main">
        <form id="char-editor">
            <div id="component-info-value"></div>
            <div id="component-ability-value"></div>
            <div class="ability-control-bar">
                <button type="button" class="btn-random-all" onclick="rollAll()">一斉ランダム</button>
            </div>
            <div id="component-skills-list"></div>

            <div class="details-section">
                <div class="acc-group">
                    <div class="acc-header" onclick="this.parentElement.classList.toggle('open')">戦闘・武器・防具 <span class="acc-icon">▼</span></div>
                    <div class="acc-content">
                        <div id="weapons-container"></div>
                        <button type="button" class="btn-add-row" onclick="addWeaponRow()">+ 武器・防具を追加</button>
                    </div>
                </div>

                <div class="acc-group">
                    <div class="acc-header" onclick="this.parentElement.classList.toggle('open')">所持品・所持金 <span class="acc-icon">▼</span></div>
                    <div class="acc-content">
                        <div id="items-container"></div>
                        <button type="button" class="btn-add-row" onclick="addItemRow()">+ 所持品を追加</button>
                        <div class="money-fixed-box">
                            <label>現在の所持金 <input type="text" id="char-money" placeholder="例: 100,000円"></label>
                            <label>借金 <input type="text" id="char-debt" placeholder="例: 0円"></label>
                        </div>
                    </div>
                </div>

                <div class="acc-group">
                    <div class="acc-header" onclick="this.parentElement.classList.toggle('open')">通過したシナリオ <span class="acc-icon">▼</span></div>
                    <div class="acc-content">
                        <div id="scenarios-container"></div>
                        <button type="button" class="btn-add-row" onclick="addScenarioRow()">+ シナリオ歴を追加</button>
                    </div>
                </div>

                <div class="acc-group open">
                    <div class="acc-header" onclick="this.parentElement.classList.toggle('open')">詳細メモ（秘匿・バックストーリー等） <span class="acc-icon">▼</span></div>
                    <div class="acc-content">
                        <div id="memos-container"></div>
                        <button type="button" class="btn-add-row" onclick="addMemoRow()">+ 新しいメモを作成</button>
                    </div>
                </div>
            </div>

            <div id="js-tooltip" class="custom-tooltip"></div>
            <div class="control-footer">
                <button type="button" class="btn-submit" onclick="saveCharacter()">保存して玄関に戻る</button>
            </div>
        </form>
    </main>

    <div id="pwd-modal" class="modal">
        <div class="modal-content">
            <h3>パスワード設定</h3>
            <p style="color:#aaa; font-size:12px; margin:0;">このメモを閲覧画面で保護します。</p>
            <label>パスワード (空欄で解除)<input type="text" id="modal-pwd-input" placeholder="パスワードを入力"></label>
            <div class="modal-actions">
                <button type="button" class="btn-modal-cancel" onclick="closePasswordModal()">キャンセル</button>
                <button type="button" class="btn-modal-save" onclick="applyPassword()">保存</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        window.db = db; window.doc = doc; window.setDoc = setDoc;
    </script>

    <script src="basic_information/basic_information.js"></script>
    <script src="skill_value/skill_value.js"></script>
    <script src="ability_value/ability_value.js"></script>

<script>
    // --- 行の並べ替え・削除共通ロジック ---
    function moveUp(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
    }
    function moveDown(btn) {
        const row = btn.closest('.dynamic-row');
        if (row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
    }
    function deleteRow(btn) {
        if(confirm('この項目を削除しますか？')) btn.closest('.dynamic-row').remove();
    }

    // --- 各項目の追加ロジック ---
    function addWeaponRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row weapon-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs weapon-grid-top">
                <label>名称<input type="text" class="w-name" value="${data.name||''}"></label>
                <label>成功率<input type="text" class="w-rate" value="${data.rate||''}"></label>
                <label>ダメージ<input type="text" class="w-dmg" value="${data.damage||''}"></label>
            </div>
            <div class="grid-inputs weapon-grid-bottom" style="margin-top:8px;">
                <label>射程<input type="text" class="w-range" value="${data.range||''}"></label>
                <label>攻撃回数<input type="text" class="w-attacks" value="${data.attacks||''}"></label>
                <label>装弾数<input type="text" class="w-ammo" value="${data.ammo||''}"></label>
                <label>耐久力<input type="text" class="w-hp" value="${data.hp||''}"></label>
                <label>故障<input type="text" class="w-malf" value="${data.malf||''}"></label>
                <label>その他<input type="text" class="w-other" value="${data.other||''}"></label>
            </div>
        `;
        document.getElementById('weapons-container').appendChild(div);
    }

    function addItemRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row item-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs item-grid-top">
                <label>名称<input type="text" class="i-name" value="${data.name||''}"></label>
                <label>単価<input type="text" class="i-unit" value="${data.unitPrice||''}"></label>
                <label>個数<input type="text" class="i-qty" value="${data.quantity||''}"></label>
            </div>
            <div class="grid-inputs item-grid-bottom" style="margin-top:8px;">
                <label>価格 (自動/手動)<input type="text" class="i-total" value="${data.totalPrice||''}"></label>
                <label>効果・備考など<input type="text" class="i-notes" value="${data.notes||''}"></label>
            </div>
        `;
        document.getElementById('items-container').appendChild(div);
    }

    function addScenarioRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row scenario-row';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs scenario-grid">
                <label>完了日<input type="text" class="s-date" placeholder="YYYY/MM/DD" value="${data.date||''}"></label>
                <label>シナリオ名<input type="text" class="s-name" value="${data.name||''}"></label>
            </div>
        `;
        document.getElementById('scenarios-container').appendChild(div);
    }

    // パスワード設定機能
    let activePwdInput = null;
    function openPasswordModal(btn) {
        activePwdInput = btn.closest('.memo-row').querySelector('.m-pwd');
        document.getElementById('modal-pwd-input').value = activePwdInput.value;
        document.getElementById('pwd-modal').style.display = 'flex';
    }
    function closePasswordModal() { document.getElementById('pwd-modal').style.display = 'none'; activePwdInput = null; }
    function applyPassword() {
        if(activePwdInput) activePwdInput.value = document.getElementById('modal-pwd-input').value;
        closePasswordModal();
    }

    function addMemoRow(data = {}) {
        const div = document.createElement('div'); div.className = 'dynamic-row memo-row';
        const hasPwd = data.password && data.password !== '';
        div.innerHTML = `
            <div class="row-controls"><button type="button" onclick="moveUp(this)">▲</button><button type="button" onclick="moveDown(this)">▼</button><button type="button" class="btn-del" onclick="deleteRow(this)">✖ 削除</button></div>
            <div class="grid-inputs memo-grid-top">
                <label style="color:#bb86fc; font-weight:bold;">メモタイトル<input type="text" class="m-title" value="${data.title||''}" style="font-size:16px; border-color:#6366f1;"></label>
                <button type="button" onclick="openPasswordModal(this)" style="height:36px; padding:0 15px; background:#4f545c; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                    ${hasPwd ? '🔒 保護中' : '🔑 パスワード設定'}
                </button>
            </div>
            <textarea class="m-content" style="width:100%; height:150px; margin-top:10px; resize:vertical;" placeholder="詳細な情報を入力...">${data.content||''}</textarea>
            <input type="hidden" class="m-pwd" value="${data.password||''}">
        `;
        document.getElementById('memos-container').appendChild(div);
    }

    // --- ロード・セーブ処理 ---
    document.addEventListener("DOMContentLoaded", () => {
        const editIndex = localStorage.getItem('editingIndex');
        if (editIndex !== null && editIndex !== "") {
            const chars = JSON.parse(localStorage.getItem('characters') || '[]');
            const char = chars[parseInt(editIndex, 10)];
            if (char) {
                window.charMainImages = char.mainImages || []; window.charExprImages = char.exprImages || [];
                if(typeof updateMainPreview === 'function') updateMainPreview();

                // 単一項目の復元
                setTimeout(() => {
                    document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
                        let key = el.name || el.id;
                        if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
                        if (key && char[key] !== undefined) {
                            if (el.type === 'checkbox') el.checked = char[key]; else el.value = char[key];
                        }
                    });
                    if(char.money) document.getElementById('char-money').value = char.money;
                    if(char.debt) document.getElementById('char-debt').value = char.debt;

                    if (typeof calcAll === 'function') calcAll();
                    if (typeof calcSkills === 'function') calcSkills();
                }, 100);

                // 動的リストの復元
                if(char.weapons) char.weapons.forEach(w => addWeaponRow(w));
                if(char.items) char.items.forEach(i => addItemRow(i));
                if(char.scenarios) char.scenarios.forEach(s => addScenarioRow(s));
                if(char.memos) char.memos.forEach(m => addMemoRow(m));
            }
        }
        
        // 新規作成時などで空なら1行ずつデフォで出しておく
        if(document.getElementById('weapons-container').children.length === 0) addWeaponRow();
        if(document.getElementById('items-container').children.length === 0) addItemRow();
        if(document.getElementById('scenarios-container').children.length === 0) addScenarioRow();
        if(document.getElementById('memos-container').children.length === 0) addMemoRow({title: "基本設定メモ"});
    });

    async function saveCharacter() {
        const chars = JSON.parse(localStorage.getItem('characters') || '[]');
        const editIndex = localStorage.getItem('editingIndex');
        const newData = {};

        // 単一データ収集
        document.querySelectorAll("#char-editor input:not(.dynamic-row input), #char-editor select").forEach((el, index) => {
            let key = el.name || el.id;
            if (!key && el.classList.contains('skill-name-inline')) key = 'inline-skill-' + index;
            if (key) newData[key] = el.type === 'checkbox' ? el.checked : el.value;
        });

        // 画像、所持金、名前
        newData.mainImages = window.charMainImages || [];
        newData.exprImages = window.charExprImages || [];
        newData.name = document.getElementById("char-name-new")?.value || "無名の探索者";
        newData.money = document.getElementById("char-money").value;
        newData.debt = document.getElementById("char-debt").value;

        // 動的リスト収集
        newData.weapons = Array.from(document.querySelectorAll('.weapon-row')).map(row => ({
            name: row.querySelector('.w-name').value, rate: row.querySelector('.w-rate').value, damage: row.querySelector('.w-dmg').value,
            range: row.querySelector('.w-range').value, attacks: row.querySelector('.w-attacks').value, ammo: row.querySelector('.w-ammo').value,
            hp: row.querySelector('.w-hp').value, malf: row.querySelector('.w-malf').value, other: row.querySelector('.w-other').value
        })).filter(w => w.name.trim() !== "");

        newData.items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
            name: row.querySelector('.i-name').value, unitPrice: row.querySelector('.i-unit').value, quantity: row.querySelector('.i-qty').value,
            totalPrice: row.querySelector('.i-total').value, notes: row.querySelector('.i-notes').value
        })).filter(i => i.name.trim() !== "");

        newData.scenarios = Array.from(document.querySelectorAll('.scenario-row')).map(row => ({
            date: row.querySelector('.s-date').value, name: row.querySelector('.s-name').value
        })).filter(s => s.name.trim() !== "");

        newData.memos = Array.from(document.querySelectorAll('.memo-row')).map(row => ({
            title: row.querySelector('.m-title').value, content: row.querySelector('.m-content').value, password: row.querySelector('.m-pwd').value
        })).filter(m => m.title.trim() !== "" || m.content.trim() !== "");

        // 既存データのID引き継ぎ
        if (editIndex !== null && editIndex !== "") {
            newData.uid = chars[parseInt(editIndex, 10)].uid;
            chars[parseInt(editIndex, 10)] = newData;
            localStorage.removeItem('editingIndex');
        } else {
            newData.uid = 'char_' + Date.now().toString(16) + Math.random().toString(16).slice(2);
            chars.push(newData);
        }

        // Firebase同期処理
        try {
            if (window.setDoc && window.doc && window.db) {
                await window.setDoc(window.doc(window.db, "characters", newData.uid), newData);
            }
            localStorage.setItem('characters', JSON.stringify(chars));
            alert("保存しました！");
            window.location.href = "../index.html";
        } catch (e) {
            console.error("保存エラー:", e);
            alert("保存に失敗しました。容量制限または通信エラーの可能性があります。");
        }
    }
</script>
</body>
</html>
