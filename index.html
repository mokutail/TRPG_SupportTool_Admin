<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Cthulhu Architect</title>
</head>
<body>
    <header>
        <h1>Cthulhu Architect</h1>
        <div class="header-actions">
            <div id="drop-zone" class="drop-zone">
                📝 ドロップ または Ctrl+V<br>（クリックでファイルを選択）
            </div>
            <input type="file" id="file-input" style="display:none;" accept=".txt,.json">
            
            <a href="coc6th_editor/coc6th_edit.html" class="btn-new" onclick="localStorage.removeItem('editingIndex')">+ 新規作成</a>
        </div>
    </header>

    <main id="dashboard" class="char-list"></main>

    <div id="export-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>出力形式を選択</h3>
            <button class="btn-select" onclick="executeExport('cocofolia')">ココフォリア形式</button>
            <button class="btn-select" onclick="executeExport('json')">JSON形式</button>
            <button class="btn-select cancel" onclick="closeModal()">キャンセル</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
